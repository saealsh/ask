<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0a12">
<title>36 — سؤال المجلس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Inter:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bronze:#e0954a;--bronze-light:#f6b46a;--burnt:#e2641c;--burnt-light:#f57a2c;--gold:#f2c879;
  --bg-abyss:#070509;--bg-deep:#0d0a12;--surface:rgba(246,180,106,.06);--surface-2:rgba(246,180,106,.11);
  --glass:rgba(18,13,24,.82);--border:rgba(224,149,74,.26);--border-strong:rgba(246,180,106,.55);--glow:rgba(224,149,74,.4);
  --text:#fdf3e6;--text-warm:#f5dcb0;--text-dim:#cdac82;--text-mute:#9a8262;
  --success:#42e08a;--danger:#fb7185;--warn:#fbbf24;
  --r-lg:22px;--r-md:16px;--r-sm:12px;--shadow:0 18px 50px -18px rgba(0,0,0,.7);--ease:cubic-bezier(.22,1,.36,1);
}
body.girls{
  --bronze:#e87bb0;--bronze-light:#f5a3cc;--burnt:#d6256b;--burnt-light:#ef3d87;--gold:#ffc9e0;
  --surface:rgba(245,163,204,.07);--surface-2:rgba(245,163,204,.12);--border:rgba(232,123,176,.28);
  --border-strong:rgba(245,163,204,.55);--glow:rgba(232,123,176,.4);--text-warm:#ffd6e8;--text-dim:#e3b8cd;--text-mute:#b98aa0;
  --bg-abyss:#0a0508;--bg-deep:#120810;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'IBM Plex Sans Arabic',sans-serif;color:var(--text);
  background:radial-gradient(1100px 760px at 80% -12%,#1a1322,transparent 60%),
            radial-gradient(900px 700px at -10% 110%,#15101c,transparent 55%),var(--bg-abyss);
  min-height:100%;overflow-x:hidden;
}
body.girls{background:radial-gradient(1100px 760px at 80% -12%,#2a0f1d,transparent 60%),
            radial-gradient(900px 700px at -10% 110%,#1d0a14,transparent 55%),var(--bg-abyss)}
.disp{font-family:'Baloo Bhaijaan 2',cursive}
.num{font-family:'Inter',sans-serif;font-weight:800}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:22px 16px 40px;position:relative}
.screen{animation:fade .38s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* brand */
.brand-logo{width:66px;height:66px;border-radius:19px;margin:0 auto;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--bronze-light),var(--burnt));box-shadow:0 14px 32px -10px var(--glow)}
.brand-logo .num{font-size:31px;color:#1a0f06}
.brand-name{font-size:44px;line-height:1;margin-top:10px;text-align:center;
  background:linear-gradient(120deg,var(--gold),var(--burnt-light));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-sub{text-align:center;color:var(--text-warm);font-weight:700;font-size:19px;margin-top:2px}
.brand-tag{text-align:center;color:var(--text-mute);font-size:13px;margin-top:5px}
.hero-badge{margin:14px auto 0;width:max-content;background:var(--surface-2);border:1px solid var(--border);
  padding:7px 16px;border-radius:999px;font-size:13px;color:var(--text-warm);font-weight:600}

.section-title{font-size:13px;color:var(--text-mute);font-weight:700;margin:22px 4px 11px;letter-spacing:.4px}
.btn{font-family:inherit;font-weight:700;border:0;border-radius:var(--r-sm);cursor:pointer;font-size:15px;padding:14px 18px;transition:.2s var(--ease)}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(120deg,var(--bronze),var(--burnt));color:#1a0f06;box-shadow:0 12px 28px -10px var(--glow);width:100%}
.btn-primary:disabled{filter:grayscale(.7);opacity:.5;cursor:not-allowed;box-shadow:none}
.btn-ghost{background:var(--surface);border:1px solid var(--border);color:var(--text-dim)}
.top-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.top-head h2{font-size:21px}
.icon-btn{width:42px;height:42px;border-radius:13px;background:var(--surface);border:1px solid var(--border);color:var(--text-dim);display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{border-color:var(--border-strong);color:var(--text)}

/* hub */
.hub-card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r-md);margin-bottom:12px;
  background:var(--surface);border:1px solid var(--border);cursor:pointer;transition:.25s var(--ease)}
.hub-card:hover{transform:translateY(-3px);border-color:var(--border-strong);background:var(--surface-2)}
.hub-card .ic{width:54px;height:54px;border-radius:15px;flex-shrink:0;display:grid;place-items:center;color:#fff}
.hub-card .t{font-weight:700;font-size:18px}
.hub-card .d{font-size:12.5px;color:var(--text-dim);margin-top:3px;line-height:1.6}
.hub-card .arrow{margin-inline-start:auto;color:var(--text-mute);font-size:24px}
.hub-card.soon{opacity:.55;cursor:default}.hub-card.soon:hover{transform:none}
.soon-pill{font-size:10px;background:var(--surface-2);border:1px solid var(--border);padding:2px 8px;border-radius:999px;color:var(--text-mute);margin-inline-start:6px}

/* primary cta + tiles */
.primary-cta{display:flex;align-items:center;gap:14px;padding:18px;border-radius:var(--r-md);cursor:pointer;
  background:linear-gradient(125deg,var(--bronze),var(--burnt));color:#1a0f06;box-shadow:0 14px 32px -12px var(--glow)}
.primary-cta:active{transform:scale(.98)}
.primary-cta .ic{width:50px;height:50px;border-radius:14px;background:rgba(255,255,255,.22);display:grid;place-items:center}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:11px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:16px;text-align:center;cursor:pointer;transition:.2s var(--ease)}
.tile:hover{transform:translateY(-3px);border-color:var(--border-strong)}
.tile .ic{color:var(--bronze-light);margin-bottom:8px;display:flex;justify-content:center}
.tile .t{font-weight:700;font-size:15px}.tile .d{font-size:11.5px;color:var(--text-mute);margin-top:3px}

/* setup teams */
.team-row{display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--border);margin-bottom:10px}
.team-av{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;font-size:25px;flex-shrink:0;cursor:pointer;border:2px solid var(--border)}
.team-row input{flex:1;background:var(--bg-deep);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:15px;padding:11px 12px}
.team-row input:focus{outline:0;border-color:var(--border-strong)}
.swatches{display:flex;gap:6px}
.sw{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.15s}
.sw.on{border-color:#fff;transform:scale(1.18)}
.rm{width:34px;height:34px;border-radius:10px;background:rgba(251,113,133,.14);border:1px solid rgba(251,113,133,.3);color:var(--danger);cursor:pointer;font-size:18px;flex-shrink:0}
.cnt-pill{background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:5px 13px;font-size:12px;color:var(--text-warm);font-weight:600}
.cat-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:9px}
.cat-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r-sm);padding:12px 4px;text-align:center;cursor:pointer;position:relative;transition:.2s var(--ease)}
.cat-card:hover{border-color:var(--border-strong)}
.cat-card.sel{border-color:var(--cat);background:color-mix(in srgb,var(--cat) 15%,transparent)}
.cat-card .em{font-size:25px}
.cat-card .nm{font-size:11px;font-weight:600;margin-top:5px;line-height:1.25}
.cat-card .chk{position:absolute;top:5px;inset-inline-start:5px;width:17px;height:17px;border-radius:50%;background:var(--cat);color:#fff;display:none;place-items:center;font-size:10px}
.cat-card.sel .chk{display:grid}

/* avatar picker modal */
.modal-bg{position:fixed;inset:0;background:rgba(5,3,8,.7);backdrop-filter:blur(4px);z-index:80;display:grid;place-items:center;padding:20px;animation:fade .2s}
.modal{background:var(--bg-deep);border:1px solid var(--border-strong);border-radius:var(--r-lg);padding:20px;max-width:340px;width:100%;box-shadow:var(--shadow)}
.av-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.av-opt{aspect-ratio:1;border-radius:13px;background:var(--surface);border:1px solid var(--border);font-size:26px;cursor:pointer;display:grid;place-items:center;transition:.15s}
.av-opt:hover{border-color:var(--border-strong);transform:scale(1.08)}

/* grid 6x6 */
.game-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.round-pill{background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;color:var(--text-warm)}
.turn-banner{text-align:center;font-weight:700;font-size:18px;margin:6px 0 14px}
.turn-banner b{color:var(--bronze-light)}
.prog{height:9px;border-radius:9px;background:rgba(0,0,0,.4);overflow:hidden;margin-bottom:5px}
.prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--burnt));transition:width .5s var(--ease)}
.prog-lbl{text-align:center;font-size:11px;color:var(--text-mute);margin-bottom:16px}
.grid66{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.gh{text-align:center;font-size:9.5px;font-weight:700;padding-bottom:6px;line-height:1.25}
.gh .ge{font-size:18px;display:block;margin-bottom:2px}
.cell{aspect-ratio:1;border-radius:11px;display:grid;place-items:center;font-family:'Inter';font-weight:800;font-size:15px;cursor:pointer;border:1px solid var(--border);transition:.18s var(--ease)}
.cell:hover{transform:scale(1.07);z-index:2}
.cell.easy{background:rgba(66,224,138,.1);color:#7ef0ad;border-color:rgba(66,224,138,.28)}
.cell.med{background:rgba(251,191,36,.1);color:#fcd34d;border-color:rgba(251,191,36,.28)}
.cell.hard{background:rgba(251,113,133,.1);color:#fda4af;border-color:rgba(251,113,133,.28)}
.cell.used{background:rgba(255,255,255,.02);color:var(--text-mute);cursor:default;opacity:.4}
.cell.used:hover{transform:none}
.score-strip{display:flex;gap:8px;margin-top:18px}
.sstrip{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:9px;text-align:center}
.sstrip.lead{border-color:var(--border-strong);background:var(--surface-2)}
.sstrip .av{font-size:19px}.sstrip .nm{font-size:11px;color:var(--text-dim);margin-top:1px}
.sstrip .sc{font-family:'Inter';font-weight:800;font-size:17px}

/* play */
.timer-bar{margin-bottom:14px}
.timer-track{height:10px;border-radius:9px;background:rgba(0,0,0,.45);overflow:hidden}
.timer-fill{height:100%;border-radius:9px;background:linear-gradient(90deg,var(--success),var(--gold));transition:width 1s linear}
.timer-fill.warn{background:linear-gradient(90deg,var(--warn),var(--burnt))}
.timer-fill.danger{background:linear-gradient(90deg,var(--danger),#dc2626)}
.timer-num{text-align:center;font-family:'Inter';font-weight:800;font-size:13px;color:var(--text-warm);margin-top:6px}
.play-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.badge{background:linear-gradient(120deg,var(--bronze),var(--burnt));color:#1a0f06;font-weight:800;padding:7px 15px;border-radius:999px;font-size:13px}
.play-cat{display:flex;align-items:center;gap:7px;font-weight:700;font-size:14px}
.teams-row{display:flex;gap:8px;margin-bottom:16px}
.tchip{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:9px;text-align:center}
.tchip.active{border-color:var(--bronze-light);background:var(--surface-2);box-shadow:0 0 0 1px var(--bronze-light) inset}
.tchip .av{font-size:20px}.tchip .nm{font-size:11px;color:var(--text-dim);margin-top:2px}
.tchip .sc{font-family:'Inter';font-weight:800;font-size:17px;margin-top:1px}
.q-card{background:linear-gradient(150deg,var(--surface-2),var(--surface));border:1px solid var(--border-strong);
  border-radius:var(--r-lg);padding:26px 18px;text-align:center;margin-bottom:16px;min-height:118px;display:grid;place-items:center}
.q-card .q{font-size:21px;font-weight:700;line-height:1.7}
.answers{display:flex;flex-direction:column;gap:10px}
.ans{display:flex;align-items:center;gap:12px;padding:15px 14px;border-radius:var(--r-sm);background:var(--surface);border:1.5px solid var(--border);
  cursor:pointer;font-family:inherit;font-size:15.5px;color:var(--text);text-align:start;transition:.18s var(--ease);width:100%}
.ans:hover:not(:disabled){border-color:var(--border-strong);background:var(--surface-2)}
.ans:disabled{cursor:default}
.ans .lt{width:31px;height:31px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;flex-shrink:0;color:var(--bronze-light)}
.ans.correct{border-color:var(--success);background:rgba(66,224,138,.15)}
.ans.correct .lt{background:var(--success);color:#06281a}
.ans.wrong{border-color:var(--danger);background:rgba(251,113,133,.13)}
.ans.wrong .lt{background:var(--danger);color:#2a0810}
.ans.faded{opacity:.4}
.ans.gone{opacity:.25;text-decoration:line-through}
.lifelines{display:flex;gap:8px;margin-top:16px}
.ll{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 4px;text-align:center;cursor:pointer;transition:.18s var(--ease)}
.ll:hover:not(.spent){border-color:var(--border-strong)}
.ll.spent{opacity:.35;cursor:default}
.ll.armed{border-color:var(--bronze-light);background:var(--surface-2)}
.ll .lic{font-size:19px}.ll .lt{font-size:10px;color:var(--text-dim);margin-top:3px}

/* summary */
.trophy{font-size:64px;text-align:center;margin:6px 0;animation:pop .6s var(--ease)}
.win-name{text-align:center;font-size:27px;font-weight:800;background:linear-gradient(120deg,var(--gold),var(--burnt-light));-webkit-background-clip:text;background-clip:text;color:transparent}
.win-sub{text-align:center;color:var(--text-dim);font-size:14px;margin-top:2px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:26px 0}
.pod{border-radius:14px 14px 0 0;display:flex;flex-direction:column;align-items:center;padding:12px 8px;width:88px;
  background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--border);border-bottom:0;animation:rise .5s var(--ease) backwards}
.pod .av{font-size:27px;margin-bottom:4px}.pod .nm{font-size:12px;font-weight:600;text-align:center}
.pod .sc{font-family:'Inter';font-weight:800;font-size:18px;color:var(--bronze-light)}
.pod .rk{font-family:'Inter';font-weight:900;font-size:14px;color:var(--text-mute);margin-top:4px}
.pod.p1{height:158px;border-color:var(--border-strong);box-shadow:0 -10px 30px -14px var(--glow)}
.pod.p2{height:126px}.pod.p3{height:102px}.pod.p4{height:88px;width:74px}
.standings{margin:18px 0}
.stand-row{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:12px;background:var(--surface);border:1px solid var(--border);margin-bottom:8px}
.stand-row .av{font-size:20px}.stand-row .nm{font-weight:600;flex:1}
.stand-row .sc{font-family:'Inter';font-weight:800;color:var(--bronze-light)}
.sum-actions{display:flex;flex-direction:column;gap:10px;margin-top:8px}

/* confetti */
.confetti{position:fixed;top:-10px;width:9px;height:14px;z-index:90;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}

.center-note{text-align:center;font-size:11.5px;color:var(--text-mute);margin-top:14px;line-height:1.7}
.theme-toggle{position:absolute;top:22px;inset-inline-start:16px;display:flex;gap:6px}
.tg{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);cursor:pointer}
.tg.on{border-color:#fff}
.tg.boys{background:linear-gradient(135deg,#e0954a,#e2641c)}
.tg.girls-c{background:linear-gradient(135deg,#e87bb0,#d6256b)}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============ قاعدة البيانات ============ */
const CATEGORIES=[
 {id:'cities',name:'مدن وعواصم',icon:'🌆',color:'#3b82f6'},
 {id:'flags',name:'أعلام الدول',icon:'🚩',color:'#ef4444'},
 {id:'geo',name:'جغرافيا',icon:'🌍',color:'#10b981'},
 {id:'history',name:'التاريخ',icon:'📜',color:'#b45309'},
 {id:'sport',name:'الرياضة',icon:'⚽',color:'#16a34a'},
 {id:'science',name:'العلوم',icon:'🔬',color:'#6366f1'},
 {id:'animals',name:'الحيوانات',icon:'🦁',color:'#84cc16'},
 {id:'general',name:'ثقافة عامة',icon:'💡',color:'#14b8a6'},
];
// لكل فئة 6 أسئلة مرتبة من الأسهل للأصعب — a = الإجابة الصحيحة، o = الخيارات الخاطئة
const QUESTIONS={
 cities:[
  {q:'ما هي عاصمة مصر؟',a:'القاهرة',o:['الإسكندرية','الجيزة','أسوان']},
  {q:'ما هي عاصمة اليابان؟',a:'طوكيو',o:['أوساكا','كيوتو','ناغويا']},
  {q:'ما هي عاصمة كندا؟',a:'أوتاوا',o:['تورنتو','مونتريال','فانكوفر']},
  {q:'ما هي عاصمة أستراليا؟',a:'كانبيرا',o:['سيدني','ملبورن','بيرث']},
  {q:'ما هي عاصمة البرازيل؟',a:'برازيليا',o:['ريو دي جانيرو','ساو باولو','سلفادور']},
  {q:'ما هي عاصمة كازاخستان؟',a:'أستانا',o:['ألماتي','شيمكنت','كاراغندا']},
 ],
 flags:[
  {q:'ورقة القيقب الحمراء تتوسط علم أي دولة؟',a:'كندا',o:['أمريكا','بريطانيا','أستراليا']},
  {q:'أي دولة علمها دائرة حمراء على خلفية بيضاء؟',a:'اليابان',o:['كوريا الجنوبية','الصين','بنغلاديش']},
  {q:'علم أي دولة يضم 50 نجمة؟',a:'الولايات المتحدة',o:['بريطانيا','البرازيل','الصين']},
  {q:'شجرة الأرز تتوسط علم أي دولة؟',a:'لبنان',o:['سوريا','الأردن','العراق']},
  {q:'علم أي دولة يحوي سيفاً وكلمة التوحيد؟',a:'السعودية',o:['قطر','الكويت','عُمان']},
  {q:'علم أي دولة يحوي عجلة "دارما" الزرقاء في وسطه؟',a:'الهند',o:['باكستان','سريلانكا','نيبال']},
 ],
 geo:[
  {q:'ما أكبر محيط في العالم؟',a:'المحيط الهادئ',o:['المحيط الأطلسي','المحيط الهندي','المتجمد الشمالي']},
  {q:'ما أكبر قارة من حيث المساحة؟',a:'آسيا',o:['أفريقيا','أمريكا الشمالية','أوروبا']},
  {q:'ما أعلى قمة جبلية في العالم؟',a:'إيفرست',o:['كي2','كليمنجارو','مونت بلانك']},
  {q:'ما أكبر صحراء حارة في العالم؟',a:'الصحراء الكبرى',o:['الربع الخالي','كالاهاري','جوبي']},
  {q:'ما النهر الذي يُعدّ من أطول أنهار العالم ويمرّ بمصر؟',a:'النيل',o:['الأمازون','المسيسيبي','اليانغتسي']},
  {q:'ما أعمق نقطة في محيطات الأرض؟',a:'خندق ماريانا',o:['خندق تونغا','خندق بورتوريكو','خندق جاوة']},
 ],
 history:[
  {q:'في أي عام انتهت الحرب العالمية الثانية؟',a:'1945',o:['1939','1918','1950']},

  {q:'في نظام الألوان الضوئي RGB، كم عدد الألوان الأساسية؟',a:'3',o:['4','5','2']},
 ],
};
const POINTS=[100,200,300,400,500,600];
const DIFF=['easy','easy','med','med','hard','hard'];
const AVATARS=['🦅','🐺','🦁','🐯','🐉','🦊','🐻','🦉','🦈','🐧','🐗','🦌'];
const COLORS=['#5eb3f0','#fb7185','#42e08a','#fbbf24','#a855f7','#f97316'];

/* ============ الحالة ============ */
let S={screen:'hub',theme:'boys',teams:[],cats:[],grid:null,turn:0,
  cur:null,timer:null,timeLeft:0,timeMax:30,revealed:false,armDouble:false,modal:null};

function defaultTeams(){
  return [
    {name:'فريق الصقور',avatar:'🦅',color:'#5eb3f0',score:0,ll:{fifty:true,double:true,skip:true}},
    {name:'فريق الذئاب',avatar:'🐺',color:'#fb7185',score:0,ll:{fifty:true,double:true,skip:true}},
  ];
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function arNum(n){return Number(n).toLocaleString('ar-EG')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ============ التنقّل ============ */
function go(scr){S.screen=scr;S.modal=null;render()}
function render(){
  const a=document.getElementById('app');
  let h='';
  if(S.screen==='hub')h=vHub();
  else if(S.screen==='setup')h=vSetup();
  else if(S.screen==='grid')h=vGrid();
  else if(S.screen==='play')h=vPlay();
  else if(S.screen==='summary')h=vSummary();
  a.innerHTML='<div class="screen">'+h+'</div>'+(S.modal?modalHtml():'');
  if(S.screen==='play'&&!S.revealed)startTimer();
}

/* ============ HUB ============ */

  return `

  </div>

    <div class="ic" style="background:linear-gradient(135deg,#a855f7,#7c3aed)">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/></svg></div>
    <div><div class="t">الجاسوس <span class="soon-pill">قريباً</span></div><div class="d">اكشفوا الجاسوس برّا السالفة</div></div>
  </div>
  <div class="hub-card soon">
    <div class="ic" style="background:linear-gradient(135deg,#22c55e,#15803d)">

    <div><div class="t">من الأكثر؟ <span class="soon-pill">قريباً</span></div><div class="d">صوّتوا على الأنسب بأسئلة طريفة</div></div>

function setTheme(t){S.theme=t;document.body.classList.toggle('girls',t==='girls');render()}

/* ============ SETUP ============ */
function vSetup(){
  if(!S.teams.length)S.teams=defaultTeams();
  const teamsHtml=S.teams.map((t,i)=>`
    <div class="team-row">
      <div class="team-av" style="background:${t.color}22;color:${t.color}" onclick="pickAvatar(${i})">${t.avatar}</div>
      <input value="${esc(t.name)}" oninput="S.teams[${i}].name=this.value" placeholder="اسم الفريق" maxlength="20"/>
      <div class="swatches">${COLORS.slice(0,3).map(c=>`<i class="sw ${t.color===c?'on':''}" style="background:${c}" onclick="setColor(${i},'${c}')"></i>`).join('')}</div>
      ${S.teams.length>2?`<button class="rm" onclick="removeTeam(${i})">×</button>`:''}
    </div>`).join('');
  const catsHtml=CATEGORIES.map(c=>{
    const sel=S.cats.includes(c.id);
    return `<div class="cat-card ${sel?'sel':''}" style="--cat:${c.color}" onclick="toggleCat('${c.id}')">
      <div class="chk">✓</div><div class="em">${c.icon}</div><div class="nm">${c.name}</div></div>`;
  }).join('');
  const can=S.cats.length===6&&S.teams.every(t=>t.name.trim());
  return `
  <div class="top-head">
    <button class="btn btn-ghost" style="padding:9px 13px" onclick="go('hub')">رجوع ›</button>
    <h2 class="disp">إعداد اللعبة</h2><div style="width:60px"></div>
  </div>
  <div class="section-title">الفرق <span style="color:var(--text-mute);font-weight:400">(٢ إلى ٦)</span></div>
  ${teamsHtml}
  ${S.teams.length<6?`<button class="btn btn-ghost" style="width:100%" onclick="addTeam()">+ إضافة فريق</button>`:''}
  <div style="display:flex;align-items:center;justify-content:space-between;margin-top:24px">
    <div class="section-title" style="margin:0">اختر ٦ فئات</div>
    <div class="cnt-pill">${arNum(S.cats.length)} / ٦</div>
  </div>
  <div class="cat-grid">${catsHtml}</div>
  <button class="btn btn-primary" style="margin-top:22px" ${can?'':'disabled'} onclick="startGame()">ابدأ اللعبة ⚔️</button>
  ${S.cats.length!==6?`<p class="center-note">اختر ٦ فئات بالضبط للبدء</p>`:''}`;
}
function addTeam(){
  const used=S.teams.map(t=>t.avatar);
  const av=AVATARS.find(a=>!used.includes(a))||'🐾';
  const col=COLORS[S.teams.length%COLORS.length];
  S.teams.push({name:'فريق '+arNum(S.teams.length+1),avatar:av,color:col,score:0,ll:{fifty:true,double:true,skip:true}});
  render();
}
function removeTeam(i){S.teams.splice(i,1);render()}
function setColor(i,c){S.teams[i].color=c;render()}
function toggleCat(id){
  const k=S.cats.indexOf(id);
  if(k>=0)S.cats.splice(k,1);
  else if(S.cats.length<6)S.cats.push(id);
  render();
}
function pickAvatar(i){S.modal={type:'avatar',team:i};render()}
function modalHtml(){
  if(S.modal.type==='avatar'){
    return `<div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal"><div style="font-weight:700;text-align:center">اختر رمز الفريق</div>
      <div class="av-grid">${AVATARS.map(a=>`<div class="av-opt" onclick="setAvatar(${S.modal.team},'${a}')">${a}</div>`).join('')}</div></div></div>`;
  }
  return '';
}
function setAvatar(i,a){S.teams[i].avatar=a;S.modal=null;render()}
function closeModal(){S.modal=null;render()}

/* ============ بدء اللعبة ============ */
function startGame(){
  S.teams.forEach(t=>{t.score=0;t.ll={fifty:true,double:true,skip:true}});
  S.grid={};
  S.cats.forEach(cid=>{
    S.grid[cid]=POINTS.map((p,r)=>({row:r,used:false}));
  });
  S.turn=0;S.armDouble=false;
  go('grid');
}

/* ============ GRID ============ */
function remaining(){return S.cats.reduce((s,c)=>s+S.grid[c].filter(x=>!x.used).length,0)}
function vGrid(){
  const rem=remaining(),done=36-rem;
  const cur=S.teams[S.turn];
  const headers=S.cats.map(cid=>{const c=CATEGORIES.find(x=>x.id===cid);
    return `<div class="gh" style="color:${c.color}"><span class="ge">${c.icon}</span>${c.name}</div>`}).join('');
  let cells='';
  for(let r=0;r<6;r++){S.cats.forEach(cid=>{
    const cell=S.grid[cid][r];
    cells+=`<div class="cell ${DIFF[r]} ${cell.used?'used':''}" onclick="${cell.used?'':`openQ('${cid}',${r})`}">${cell.used?'✓':arNum(POINTS[r])}</div>`;
  })}
  const sorted=[...S.teams].sort((a,b)=>b.score-a.score);
  const lead=sorted[0].score;
  const strip=S.teams.map(t=>`<div class="sstrip ${t.score===lead&&lead>0?'lead':''}">
    <div class="av">${t.avatar}</div><div class="nm">${esc(t.name)}</div><div class="sc" style="color:${t.color}">${arNum(t.score)}</div></div>`).join('');
  return `
  <div class="game-bar">
    <div class="icon-btn" onclick="confirmExit()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg></div>
    <div class="round-pill">باقي ${arNum(rem)} سؤال</div><div style="width:42px"></div>
  </div>
  <div class="turn-banner">دور <b>${cur.avatar} ${esc(cur.name)}</b></div>
  <div class="prog"><i style="width:${done/36*100}%"></i></div>
  <div class="prog-lbl">${arNum(done)} / ٣٦ سؤال</div>
  <div class="grid66">${headers}${cells}</div>
  <div class="score-strip">${strip}</div>
  <p class="center-note">اختر خانة — الأخضر أسهل، الأحمر أصعب وأعلى نقاطاً</p>`;
}
function confirmExit(){if(confirm('إنهاء اللعبة والعودة للرئيسية؟')){stopTimer();S.teams=[];S.cats=[];go('hub')}}

/* ============ PLAY ============ */
function openQ(cid,row){
  const base=QUESTIONS[cid][row];
  S.cur={cid,row,q:base.q,a:base.a,options:shuffle([base.a,...base.o]),
         points:POINTS[row],selected:null,eliminated:[],double:S.armDouble};
  S.revealed=false;S.timeLeft=S.timeMax;
  go('play');
}
function vPlay(){
  const g=S.cur,c=CATEGORIES.find(x=>x.id===g.cid);
  const cur=S.teams[S.turn];
  const pct=g.timeLeft/S.timeMax*100;
  const tcls=g.timeLeft<=5?'danger':g.timeLeft<=12?'warn':'';
  const pts=g.double?g.points*2:g.points;
  const LET=['أ','ب','ج','د'];
  const ans=g.options.map((o,i)=>{
    let cls='ans';let mark=LET[i];
    if(g.eliminated.includes(o)){cls+=' gone'}
    if(S.revealed){
      if(o===g.a){cls+=' correct';mark='✓'}
      else if(o===g.selected){cls+=' wrong';mark='✗'}
      else cls+=' faded';
    }
    const dis=S.revealed||g.eliminated.includes(o);
    return `<button class="${cls}" ${dis?'disabled':''} onclick="answer(${i})">
      <span class="lt">${mark}</span><span>${esc(o)}</span></button>`;
  }).join('');
  const chips=S.teams.map((t,i)=>`<div class="tchip ${i===S.turn?'active':''}">
    <div class="av">${t.avatar}</div><div class="nm">${esc(t.name)}</div>
    <div class="sc" style="color:${t.color}">${arNum(t.score)}</div></div>`).join('');
  const ll=cur.ll;
  const llHtml=S.revealed?'':`
   <div class="lifelines">
    <div class="ll ${ll.fifty?'':'spent'}" onclick="${ll.fifty?'useFifty()':''}"><div class="lic">✂️</div><div class="lt">حذف إجابتين</div></div>
    <div class="ll ${ll.double?(g.double?'armed':''):'spent'}" onclick="${ll.double?'useDouble()':''}"><div class="lic">⚡</div><div class="lt">نقاط مضاعفة</div></div>
    <div class="ll ${ll.skip?'':'spent'}" onclick="${ll.skip?'useSkip()':''}"><div class="lic">⏭️</div><div class="lt">تخطّي السؤال</div></div>
   </div>`;
  return `
  <div class="timer-bar"><div class="timer-track"><div class="timer-fill ${tcls}" style="width:${pct}%"></div></div>
    <div class="timer-num">⏱ ${S.revealed?'—':arNum(g.timeLeft)+' ثانية'}</div></div>
  <div class="play-top"><span class="badge">${arNum(pts)} نقطة ${g.double?'⚡':''}</span>
    <div class="play-cat"><span style="color:${c.color}">${c.icon}</span> ${c.name}</div></div>
  <div class="teams-row">${chips}</div>
  <div class="q-card"><div class="q">${esc(g.q)}</div></div>
  <div class="answers">${ans}</div>
  ${llHtml}
  ${S.revealed?`<button class="btn btn-primary" style="margin-top:16px" onclick="nextTurn()">${remaining()<=1?'النتيجة النهائية 🏆':'متابعة ›'}</button>`:''}`;
}
function answer(i){
  if(S.revealed)return;
  const g=S.cur,o=g.options[i];
  if(g.eliminated.includes(o))return;
  stopTimer();
  g.selected=o;S.revealed=true;
  const cur=S.teams[S.turn];
  if(o===g.a){cur.score+=g.double?g.points*2:g.points;burst()}
  S.armDouble=false;
  render();
}
function timeout(){
  stopTimer();S.cur.selected=null;S.revealed=true;S.armDouble=false;render();
}
function nextTurn(){
  S.grid[S.cur.cid][S.cur.row].used=true;
  S.cur=null;S.revealed=false;
  if(remaining()<=0){go('summary');return}
  S.turn=(S.turn+1)%S.teams.length;
  go('grid');
}
/* وسائل المساعدة */
function useFifty(){
  const cur=S.teams[S.turn];if(!cur.ll.fifty)return;cur.ll.fifty=false;
  const wrong=S.cur.options.filter(o=>o!==S.cur.a);
  S.cur.eliminated=shuffle(wrong).slice(0,2);render();
}
function useDouble(){
  const cur=S.teams[S.turn];if(!cur.ll.double)return;cur.ll.double=false;
  S.cur.double=true;S.armDouble=false;render();
}
function useSkip(){
  const cur=S.teams[S.turn];if(!cur.ll.skip)return;cur.ll.skip=false;
  stopTimer();S.grid[S.cur.cid][S.cur.row].used=true;S.cur=null;S.revealed=false;
  if(remaining()<=0){go('summary');return}
  S.turn=(S.turn+1)%S.teams.length;go('grid');
}
/* المؤقّت */
function startTimer(){
  stopTimer();
  S.timer=setInterval(()=>{
    S.timeLeft--;
    const fill=document.querySelector('.timer-fill');
    const num=document.querySelector('.timer-num');
    if(fill){fill.style.width=(S.timeLeft/S.timeMax*100)+'%';
      fill.className='timer-fill '+(S.timeLeft<=5?'danger':S.timeLeft<=12?'warn':'')}
    if(num)num.textContent='⏱ '+arNum(Math.max(0,S.timeLeft))+' ثانية';
    if(S.timeLeft<=0)timeout();
  },1000);
}
function stopTimer(){if(S.timer){clearInterval(S.timer);S.timer=null}}

/* ============ SUMMARY ============ */
function vSummary(){
  const sorted=[...S.teams].sort((a,b)=>b.score-a.score);
  const win=sorted[0];
  const tie=sorted.length>1&&sorted[0].score===sorted[1].score;
  const order=[1,0,2,3];// مواقع المنصّة: الثاني، الأول، الثالث، الرابع
  const podium=order.filter(i=>i<sorted.length).map(i=>{
    const t=sorted[i],rankClass='p'+(i+1);
    const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':arNum(i+1);
    return `<div class="pod ${rankClass}" style="animation-delay:${i*.12}s">
      <div class="av">${t.avatar}</div><div class="nm">${esc(t.name)}</div>
      <div class="sc">${arNum(t.score)}</div><div class="rk">${medal}</div></div>`;
  }).join('');
  const stand=sorted.map((t,i)=>`<div class="stand-row">
    <div class="av">${t.avatar}</div><div class="nm">${esc(t.name)}</div>
    <div class="sc">${arNum(t.score)} نقطة</div></div>`).join('');
  return `
  <div class="trophy">🏆</div>
  <div class="win-name disp">${tie?'تعادل!':esc(win.name)}</div>
  <div class="win-sub">${tie?'تساوت الفرق في النقاط':'الفائز بنتيجة '+arNum(win.score)+' نقطة'}</div>
  <div class="podium">${podium}</div>
  <div class="section-title">الترتيب النهائي</div>
  <div class="standings">${stand}</div>
  <div class="sum-actions">
    <button class="btn btn-primary" onclick="startGame()">إعادة بنفس الإعداد 🔄</button>
    <div style="display:flex;gap:10px">
      <button class="btn btn-ghost" style="flex:1" onclick="go('setup')">تعديل الإعداد</button>
      <button class="btn btn-ghost" style="flex:1" onclick="go('hub')">الرئيسية</button>
    </div>
  </div>`;
}

/* confetti */
function burst(){
  const cols=['#f2c879','#e2641c','#42e08a','#5eb3f0','#fb7185','#a855f7'];
  for(let i=0;i<26;i++){
    const c=document.createElement('div');c.className='confetti';
    c.style.left=Math.random()*100+'vw';
    c.style.background=cols[i%cols.length];
    c.style.animationDuration=(1.6+Math.random()*1.4)+'s';
    c.style.animationDelay=(Math.random()*.3)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3200);
  }
}

/* init */
render();
</script>
</body>
</html>
