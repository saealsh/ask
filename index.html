  background: rgba(217,119,6,0.10); border: 1px solid var(--border-warm);
  border-radius: 12px; padding: 10px 14px; margin: 0 auto 14px; max-width: 360px;
}
.res-next { min-height: 52px; font-size: 17px; }

/* ===== مؤشر تجديد الأسئلة على بطاقة الفئة ===== */
.cat-fresh-bar {
  width: 100%;
  height: 5px;
  border-radius: 4px;
  background: rgba(255,255,255,0.12);
  overflow: hidden;
  margin-top: 8px;
}
.cat-fresh-fill { height: 100%; border-radius: 4px; transition: width .5s ease; }
.cat-fresh-label { font-size: 10px; font-weight: 700; color: var(--text-dim); margin-top: 4px; }

/* ===== شاشة الترحيب ===== */
.welcome-screen {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 30px;
  background:
    radial-gradient(circle at 50% 18%, var(--plum-light), transparent 55%),
    linear-gradient(180deg, var(--bg-royal), var(--bg-abyss));
  animation: wel-in .5s ease;
}
@keyframes wel-in { from { opacity: 0; } to { opacity: 1; } }
.welcome-screen.leaving { animation: wel-out .5s ease forwards; }
@keyframes wel-out { to { opacity: 0; transform: scale(1.04); } }
.welcome-logo { animation: wel-float 3s ease-in-out infinite; }
@keyframes wel-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.welcome-title {
  font-family: 'Inter', 'IBM Plex Sans Arabic', sans-serif;
  font-size: 64px; font-weight: 900; margin: 14px 0 0;
  background: linear-gradient(135deg, var(--gold-bright), var(--burnt-light));
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 4px 18px var(--glow-bronze));
}
.welcome-sub { font-size: 22px; font-weight: 700; color: var(--text-warm); margin-top: 4px; }
.welcome-msg {
  font-size: 16px; color: var(--text-dim); font-weight: 500;
  max-width: 340px; line-height: 1.9; margin: 18px 0 28px;
}
.welcome-chips { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 30px; }
.welcome-chip {
  font-size: 13px; font-weight: 600; color: var(--text-warm);
  background: var(--bg-card); border: 1px solid var(--border-warm);
  padding: 8px 14px; border-radius: 30px;
}
.welcome-cta {
  font-size: 19px; font-weight: 800; color: #fff;
  padding: 17px 54px; border: none; border-radius: 50px; cursor: pointer;
  background: linear-gradient(135deg, var(--bronze-light), var(--burnt-orange));
  box-shadow: 0 12px 34px var(--glow-bronze);
  animation: cta-breathe 2.4s ease-in-out infinite;
}
.welcome-cta:active { transform: scale(0.95); }
@keyframes cta-breathe { 0%,100% { transform: scale(1); box-shadow: 0 12px 34px var(--glow-bronze); } 50% { transform: scale(1.04); box-shadow: 0 16px 42px var(--glow-bronze); } }
/* =====================================================================
   ✦✦✦  DESIGN 2.0 — هوية "Playful" جريئة وملوّنة (تُطبَّق كافتراضي)  ✦✦✦
   مُلحق في نهاية الستايل ليتجاوز كل ما سبق
   ===================================================================== */

/* ---- لوحة الألوان الجديدة (تُعاد خريطة المتغيّرات لتتحوّل كل المكوّنات تلقائياً) ---- */
body, body.theme-light {
  --violet:#7c3aed; --violet-l:#a855f7; --fuchsia:#ec4899; --pink-l:#f472b6;
  --cyan:#06b6d4; --lime:#84cc16; --amber:#fb923c; --sun:#fbbf24;
  /* إعادة تعيين متغيّرات اللعبة الأصلية للهوية الجديدة */
  --bronze:#7c3aed; --bronze-light:#a855f7; --bronze-deep:#6d28d9; --copper:#8b5cf6;
  --gold-warm:#fb923c; --gold-bright:#fbbf24; --burnt-orange:#ec4899; --burnt-light:#f472b6;
  --plum:#ede9fe; --plum-light:#f5f3ff;
  --bg-royal:#f5f4ff; --bg-deep:#efeefe; --bg-abyss:#e8e7fb;
  --bg-card:#ffffff; --bg-card-hover:#faf8ff; --bg-glass:rgba(255,255,255,0.86);
  --border-warm:rgba(124,58,237,0.16); --border-strong:rgba(124,58,237,0.5);
  --glow-bronze:rgba(168,85,247,0.35);
  --text:#211a3e; --text-warm:#7c3aed; --text-dim:#6b6690; --text-mute:#9b97bf;
  --success:#10b981; --success-bg:rgba(16,185,129,0.14);
  --danger:#f43f5e; --danger-bg:rgba(244,63,94,0.12); --warn:#f59e0b;
  --radius:24px; --radius-lg:30px;
}
/* الثيم الداكن (Playful Dark) */
body.theme-dark-playful, body:not(.theme-light):not(.theme-girls) {
  --bg-royal:#161228; --bg-deep:#100c20; --bg-abyss:#0a0717;
  --bg-card:rgba(255,255,255,0.05); --bg-card-hover:rgba(255,255,255,0.1);
  --bg-glass:rgba(22,18,40,0.8);
  --text:#f4f1ff; --text-warm:#c4b5fd; --text-dim:#a99fd0; --text-mute:#7c7499;
  --border-warm:rgba(168,85,247,0.28); --border-strong:rgba(168,85,247,0.6);
}

/* ---- الخطوط: عنوان مرح عريض ---- */
body { font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif; }
.brand-name, .brand-subname, h1, h2, .title-xl, .title-lg, .title-md, .title-sm,
.btn, .answer-btn, .grid-cell, .hub-card-title, .arena-tile-title, .quick-play-title,
.onboarding-title, .welcome-title, .res-title, .pts-value, .team-score, .bn-label,
.cat-name, .grid-header-cell, .ui-confirm-msg, .badge {
  font-family:'Baloo Bhaijaan 2','IBM Plex Sans Arabic',sans-serif !important;
}

/* ---- الخلفية: تدرّج ميش ملوّن مرح ---- */
body.theme-light::before {
  background:
    radial-gradient(40% 32% at 12% 8%, rgba(168,85,247,0.22), transparent 60%),
    radial-gradient(42% 34% at 88% 6%, rgba(236,72,153,0.20), transparent 60%),
    radial-gradient(45% 38% at 92% 92%, rgba(6,182,212,0.18), transparent 62%),
    radial-gradient(45% 40% at 6% 96%, rgba(132,204,22,0.16), transparent 62%),
    linear-gradient(160deg,#f7f5ff,#eef0fe 60%,#e9f7ff) !important;
}
body.theme-light::after { opacity:.4 !important; }

/* ---- أزرار ضخمة متدرّجة بظلال ملوّنة ---- */
.btn {
  border-radius:var(--radius) !important;
  font-weight:800 !important;
  border:none !important;
  letter-spacing:.2px;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1), box-shadow .2s, filter .2s !important;
}
.btn-primary, .arena-primary-card, .welcome-cta, .res-next, .btn.btn-primary {
  background:linear-gradient(135deg,#7c3aed 0%,#a855f7 45%,#ec4899 100%) !important;
  color:#fff !important;
  box-shadow:0 10px 0 -2px rgba(124,58,237,0.25), 0 16px 34px -10px rgba(168,85,247,0.55) !important;
}
.btn-primary:active, .welcome-cta:active, .res-next:active { transform:translateY(4px) scale(.99) !important; box-shadow:0 4px 0 -2px rgba(124,58,237,0.25), 0 8px 18px -8px rgba(168,85,247,0.5) !important; }
.btn-secondary { background:#fff !important; color:var(--violet) !important; border:2.5px solid var(--violet-l) !important; box-shadow:0 8px 0 -3px rgba(124,58,237,0.18) !important; }
.btn-ghost { background:rgba(124,58,237,0.08) !important; color:var(--violet) !important; }
.btn-danger { background:linear-gradient(135deg,#f43f5e,#fb7185) !important; color:#fff !important; box-shadow:0 8px 22px -8px rgba(244,63,94,0.6) !important; }
.btn:active { transform:translateY(3px) scale(.99); }

/* ---- البطاقات: حواف كبيرة وظلال ملوّنة ناعمة ---- */
body.theme-light .card, body.theme-light .glass-card, body.theme-light .hub-game-card,
body.theme-light .xp-card, body.theme-light .resume-card, body.theme-light .arena-tile,
body.theme-light .stat-mini, body.theme-light .achievement-card, body.theme-light .team-card,
body.theme-light .modal-content, body.theme-light .res-breakdown {
  background:#fff !important;
  border:2px solid rgba(124,58,237,0.10) !important;
  border-radius:var(--radius) !important;
  box-shadow:0 12px 30px -14px rgba(124,58,237,0.30), 0 2px 0 rgba(124,58,237,0.05) !important;
}
.card, .glass-card { border-radius:var(--radius) !important; }

/* ---- الهيرو (المشهد) → بانر متدرّج مبهج ---- */
body.theme-light .scene-overlay {
  background:linear-gradient(135deg,#7c3aed 0%,#d946ef 50%,#fb7185 100%) !important;
}
body.theme-light .scene-svg { opacity:.16 !important; }
.scene-container { border-radius:var(--radius-lg) !important; border:none !important; box-shadow:0 18px 40px -16px rgba(168,85,247,0.5) !important; }
.brand-name, .welcome-title { letter-spacing:1px; }

/* ---- بطاقة اللعب السريع البارزة ---- */
.arena-primary-card { border-radius:var(--radius-lg) !important; border:none !important; padding:20px !important; }
.arena-primary-card .quick-play-title, .arena-primary-card .quick-play-desc { color:#fff !important; }
.arena-icon-badge { background:rgba(255,255,255,0.25) !important; border-radius:18px !important; }

/* ---- بطاقات الهَب ---- */
.hub-game-card { border-radius:var(--radius-lg) !important; padding:18px !important; }
.hub-card-icon { border-radius:20px !important; width:60px !important; height:60px !important; box-shadow:0 8px 20px -6px var(--glow-bronze); }
.hub-card-title { font-size:20px !important; }

/* ---- بلاطات القائمة ---- */
.arena-tile { border-radius:var(--radius) !important; padding:18px 12px !important; }
.arena-tile-icon { color:var(--violet); }
.arena-tile:nth-child(4n+1) .arena-tile-icon{ color:#7c3aed; }
.arena-tile:nth-child(4n+2) .arena-tile-icon{ color:#ec4899; }
.arena-tile:nth-child(4n+3) .arena-tile-icon{ color:#06b6d4; }
.arena-tile:nth-child(4n) .arena-tile-icon{ color:#f59e0b; }

/* ---- بطاقات الفئات: ملوّنة مرحة ---- */
.cat-card { border-radius:20px !important; border:2px solid rgba(124,58,237,0.12) !important; }
.cat-card.selected { background:linear-gradient(135deg, rgba(124,58,237,0.12), rgba(236,72,153,0.12)) !important; border-color:var(--violet-l) !important; box-shadow:0 10px 24px -10px var(--glow-bronze) !important; }

/* ---- شبكة 6×6 ---- */
.grid-game { gap:8px !important; }
.grid-cell { border-radius:16px !important; font-weight:800 !important; border:none !important; box-shadow:0 6px 0 -2px rgba(124,58,237,0.12) !important; }
.grid-cell:not(.used){ background:linear-gradient(160deg,#fff,#f3f0ff) !important; }
.grid-header-cell { border-radius:16px !important; }

/* ---- منصة السؤال والإجابات ---- */
.play-stage .question-text { border-radius:var(--radius) !important; border:2px solid rgba(124,58,237,0.10) !important; font-weight:700 !important; box-shadow:0 12px 28px -14px rgba(124,58,237,0.3) !important; }
.answers-stack .answer-btn { border-radius:18px !important; border:2.5px solid rgba(124,58,237,0.14) !important; background:#fff !important; font-weight:700 !important; box-shadow:0 6px 0 -2px rgba(124,58,237,0.10) !important; }
.answers-stack .answer-btn:hover:not(:disabled):not(.correct):not(.wrong):not(.disabled){ border-color:var(--violet-l) !important; background:#faf7ff !important; }
.answers-stack .answer-btn.correct { background:linear-gradient(135deg,#10b981,#34d399) !important; color:#fff !important; border-color:#10b981 !important; }
.answers-stack .answer-btn.wrong { background:linear-gradient(135deg,#f43f5e,#fb7185) !important; color:#fff !important; border-color:#f43f5e !important; }
.answer-letter { border-radius:12px !important; background:linear-gradient(135deg,#ede9fe,#fae8ff) !important; color:var(--violet) !important; border:none !important; }

/* ---- مؤقت شريطي ---- */
.timer-bar-track { height:14px !important; border-radius:14px !important; }
.timer-bar-fill { background:linear-gradient(90deg,#7c3aed,#ec4899) !important; }
.timer-bar.warning .timer-bar-fill { background:linear-gradient(90deg,#f59e0b,#fbbf24) !important; }
.timer-bar.danger .timer-bar-fill { background:linear-gradient(90deg,#f43f5e,#fb7185) !important; }

/* ---- شريط التنقل السفلي: حبة عائمة ---- */
.bottom-nav {
  max-width:520px !important;
  margin:0 auto !important;
  border-radius:26px !important;
  inset-inline:0 !important;
  bottom:12px !important;
  border:2px solid rgba(124,58,237,0.12) !important;
  box-shadow:0 14px 34px -10px rgba(124,58,237,0.45) !important;
  background:var(--bg-glass) !important;
  width:calc(100% - 24px) !important;
}
.bottom-nav-item.active { background:linear-gradient(135deg,#7c3aed,#ec4899) !important; color:#fff !important; box-shadow:0 8px 18px -6px rgba(168,85,247,0.6); }
.bottom-nav-item.active .bn-icon { transform:translateY(-2px) scale(1.16); }

/* ---- الأزرار العلوية ---- */
.icon-btn { border-radius:16px !important; border:2px solid rgba(124,58,237,0.14) !important; background:#fff !important; color:var(--violet) !important; box-shadow:0 6px 16px -6px var(--glow-bronze) !important; }
.pause-btn-v2 { border-radius:16px !important; background:linear-gradient(135deg,#7c3aed,#ec4899) !important; border:none !important; }

/* ---- بطاقة النتيجة والمودالات ---- */
.result-card { border-radius:30px 30px 0 0 !important; border-top:6px solid var(--rescol) !important; }
.modal-content, .ui-confirm-box { border-radius:var(--radius-lg) !important; border:2px solid rgba(124,58,237,0.12) !important; }

/* ---- الشارات ---- */
.badge { border-radius:14px !important; font-weight:800 !important; }
.badge-warm { background:linear-gradient(135deg,rgba(124,58,237,0.14),rgba(236,72,153,0.14)) !important; color:var(--violet) !important; border:none !important; }

/* ---- صفّ الفرق ---- */
.team-card { border-radius:18px !important; }
.team-card.active { box-shadow:0 0 0 3px var(--violet-l), 0 12px 24px -10px var(--glow-bronze) !important; }

/* ---- شاشة الترحيب ---- */
.welcome-screen { background:radial-gradient(60% 50% at 50% 12%, rgba(168,85,247,0.25), transparent 60%), linear-gradient(170deg,#f7f5ff,#eef0fe 60%,#e9f7ff) !important; }
.welcome-title { background:linear-gradient(135deg,#7c3aed,#ec4899,#06b6d4) !important; -webkit-background-clip:text !important; background-clip:text !important; -webkit-text-fill-color:transparent !important; }
.welcome-chip { border-radius:20px !important; border:2px solid rgba(124,58,237,0.16) !important; background:#fff !important; color:var(--violet) !important; }
.welcome-cta { border-radius:24px !important; }

/* لمسة حركة لطيفة على البطاقات التفاعلية */
.hub-game-card:active, .arena-tile:active, .cat-card:active { transform:scale(.97); }

</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="timer-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e89e54"/>
      <stop offset="100%" stop-color="#cd7f32"/>
    </linearGradient>
  </defs>
</svg>

<div id="app" class="app">
  <div class="top-controls" id="top-controls">

<script>
// تسجيل service worker لدعم العمل دون إنترنت وتثبيت اللعبة كتطبيق (PWA)
// يعمل فقط عبر http/https؛ يتجاهَل بصمت عند فتح الملف مباشرة (file://)
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
