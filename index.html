<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a1020">
<title>إسألني وبجاوبك 🎯</title>

<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- خطوط محسنة: Tajawal للنصوص (مقروء جداً)، Lalezar للعناوين (جميل وواضح) -->
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Lalezar&display=swap" rel="stylesheet">

<style>
:root {
  --gold: #e8b86b;
  --gold-light: #f4d28a;
  --gold-dark: #b8893f;
  --teal: #2dd4bf;
  --teal-dark: #14b8a6;
  --bg: #0a1020;
  --bg-mid: #131b35;
  --bg-light: #1c2548;
  --bg-card: rgba(255,255,255,0.05);
  --bg-card-hover: rgba(255,255,255,0.09);
  --border: rgba(232,184,107,0.25);
  --border-strong: rgba(232,184,107,0.5);
  --text: #f4e9d4;
  --text-dim: #b8a987;
  --text-mute: #7a6f5c;
  --danger: #ef4444;
  --success: #22c55e;
  --warn: #f59e0b;
  --purple: #a855f7;
  --pts-easy: #22c55e;
  --pts-mid: #f59e0b;
  --pts-hard: #ef4444;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  font-weight: 500;
  letter-spacing: 0;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(circle at 20% 10%, rgba(232,184,107,0.1) 0%, transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(45,212,191,0.07) 0%, transparent 40%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg-mid) 100%);
  z-index: -2;
  pointer-events: none;
}

#app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}

.app.fullscreen-mode { max-width: 100%; }
.app.fullscreen-mode .screen { padding: 32px 48px; }
.app.fullscreen-mode .title-xl { font-size: 64px !important; }
.app.fullscreen-mode .question-text { font-size: 36px !important; padding: 32px !important; min-height: 180px; }
.app.fullscreen-mode .answer-btn { font-size: 24px !important; padding: 22px !important; min-height: 75px; }
.app.fullscreen-mode .timer-circle { width: 160px !important; height: 160px !important; }
.app.fullscreen-mode .timer-number { font-size: 56px !important; }
.app.fullscreen-mode .team-name { font-size: 24px !important; }
.app.fullscreen-mode .team-score { font-size: 48px !important; }
.app.fullscreen-mode .pts-btn { padding: 36px 20px !important; }
.app.fullscreen-mode .pts-value { font-size: 56px !important; }
.app.fullscreen-mode .mode-card { padding: 24px !important; }
.app.fullscreen-mode .mode-icon { font-size: 56px !important; }
.app.fullscreen-mode .mode-name { font-size: 22px !important; }

.screen {
  padding: 20px 16px;
  min-height: 100vh;
  animation: slideIn .3s ease;
}
@keyframes slideIn { from { opacity:0; transform: translateY(10px);} to { opacity:1; transform: translateY(0);} }

/* الأزرار - واضحة ومقروءة */
.btn {
  font-family: inherit;
  font-weight: 700;
  border: 0;
  cursor: pointer;
  padding: 14px 22px;
  border-radius: 14px;
  font-size: 17px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all .2s;
  user-select: none;
  letter-spacing: 0;
}
.btn-primary {
  background: linear-gradient(135deg, var(--gold), var(--gold-dark));
  color: var(--bg);
  box-shadow: 0 4px 20px -4px rgba(232,184,107,0.5);
}
.btn-primary:active { transform: scale(0.98); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-secondary {
  background: rgba(232,184,107,0.12);
  color: var(--gold);
  border: 1px solid var(--border);
}
.btn-danger {
  background: rgba(239,68,68,0.15);
  color: var(--danger);
  border: 1px solid rgba(239,68,68,0.3);
}
.btn-ghost {
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--border);
}
.btn-sm { padding: 8px 14px; font-size: 14px; border-radius: 10px; }
.btn-full { width: 100%; }

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 18px;
}

/* العناوين - Lalezar خط جميل واضح */
.title-xl {
  font-family: 'Lalezar', 'Tajawal', sans-serif;
  font-size: 42px;
  color: var(--gold);
  text-align: center;
  margin: 16px 0 8px;
  font-weight: normal;
  letter-spacing: 1px;
  text-shadow: 0 2px 15px rgba(232,184,107,0.35);
}
.title-md {
  font-family: 'Lalezar', sans-serif;
  font-size: 28px;
  color: var(--gold);
  font-weight: normal;
  letter-spacing: 0.5px;
}
.subtitle {
  text-align: center;
  color: var(--text-dim);
  font-size: 15px;
  margin-bottom: 24px;
  font-weight: 500;
}

input, textarea, select {
  width: 100%;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 13px 16px;
  border-radius: 12px;
  font-family: inherit;
  font-size: 16px;
  font-weight: 500;
  outline: none;
  transition: all .2s;
}
input:focus, textarea:focus, select:focus { border-color: var(--gold); background: var(--bg-card-hover); }
label { display: block; font-size: 14px; color: var(--text-dim); margin-bottom: 8px; font-weight: 700; }

/* الفئات */
.categories-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}
.app.fullscreen-mode .categories-grid {
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
}
.cat-card {
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: 16px;
  padding: 16px 12px;
  text-align: center;
  cursor: pointer;
  transition: all .2s;
}
.cat-card:active { transform: scale(0.97); }
.cat-card.selected {
  background: linear-gradient(135deg, rgba(232,184,107,0.25), rgba(45,212,191,0.12));
  border-color: var(--gold);
  box-shadow: 0 0 0 2px rgba(232,184,107,0.4), 0 0 30px -10px rgba(232,184,107,0.6);
}
.cat-icon { font-size: 36px; margin-bottom: 6px; display: block; }
.cat-name { font-weight: 700; font-size: 15px; color: var(--text); }
.cat-count { font-size: 12px; color: var(--text-mute); margin-top: 4px; font-weight: 500; }

/* الفرق */
.teams-row {
  display: flex;
  gap: 10px;
  margin-bottom: 18px;
  overflow-x: auto;
  padding-bottom: 4px;
}
.team-card {
  flex: 1;
  min-width: 110px;
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: 14px;
  padding: 12px;
  text-align: center;
  transition: all .2s;
}
.team-card.active {
  border-color: var(--gold);
  background: linear-gradient(135deg, rgba(232,184,107,0.2), rgba(232,184,107,0.08));
  box-shadow: 0 0 24px -6px rgba(232,184,107,0.6);
}
.team-avatar { font-size: 30px; margin-bottom: 4px; }
.team-name { font-weight: 700; font-size: 15px; }
.team-score {
  font-family: 'Lalezar', sans-serif;
  font-size: 30px;
  color: var(--gold);
  margin-top: 4px;
  font-weight: normal;
}

/* الصفحة الرئيسية */
.welcome-hero { text-align: center; padding: 40px 0 20px; }
.welcome-logo { font-size: 70px; margin-bottom: 12px; filter: drop-shadow(0 4px 15px rgba(232,184,107,0.5)); }
.action-cards { display: grid; gap: 12px; margin-top: 24px; }
.action-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  transition: all .2s;
}
.action-card:active { transform: scale(0.98); }
.action-icon { font-size: 34px; }
.action-info { flex: 1; text-align: right; }
.action-title { font-weight: 700; font-size: 17px; margin-bottom: 3px; }
.action-desc { font-size: 13px; color: var(--text-dim); font-weight: 500; line-height: 1.5; }
.action-arrow { color: var(--gold); font-size: 22px; }

/* play */
.play-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  margin-bottom: 14px;
}
.play-cat {
  background: rgba(232,184,107,0.18);
  border: 1px solid var(--border);
  color: var(--gold);
  padding: 7px 16px;
  border-radius: 20px;
  font-weight: 700;
  font-size: 14px;
}

/* المؤقت */
.timer-container { display: flex; justify-content: center; margin: 18px 0; }
.timer-circle { width: 110px; height: 110px; position: relative; }
.timer-circle svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer-bg { fill: none; stroke: var(--bg-card); stroke-width: 8; }
.timer-fg {
  fill: none;
  stroke: var(--gold);
  stroke-width: 8;
  stroke-linecap: round;
  transition: stroke-dashoffset 1s linear, stroke 0.3s;
}
.timer-fg.warning { stroke: var(--warn); }
.timer-fg.danger { stroke: var(--danger); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
.timer-number {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Lalezar', sans-serif;
  font-size: 38px;
  color: var(--gold);
  font-weight: normal;
}

/* السؤال - خط واضح ومقروء */
.question-text {
  font-family: 'Tajawal', sans-serif;
  font-size: 22px;
  line-height: 1.6;
  text-align: center;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px 20px;
  margin: 18px 0;
  min-height: 110px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  color: var(--text);
}

.answers-grid {
  display: grid;
  gap: 10px;
  margin: 16px 0;
}
.answer-btn {
  background: var(--bg-card);
  border: 2px solid var(--border);
  color: var(--text);
  padding: 16px 18px;
  border-radius: 14px;
  font-family: inherit;
  font-weight: 700;
  font-size: 17px;
  cursor: pointer;
  transition: all .25s;
  text-align: right;
  width: 100%;
}
.answer-btn:active { transform: scale(0.98); }
.answer-btn.correct { background: rgba(34,197,94,0.25); border-color: var(--success); color: #86efac; }
.answer-btn.wrong { background: rgba(239,68,68,0.25); border-color: var(--danger); color: #fca5a5; opacity: 0.85; }
.answer-btn.disabled { opacity: 0.35; pointer-events: none; }

/* اختيار النقاط */
.pts-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin: 24px 0;
}
.pts-btn {
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: 18px;
  padding: 24px 14px;
  text-align: center;
  cursor: pointer;
  transition: all .2s;
  font-family: 'Lalezar', sans-serif;
}
.pts-btn:active { transform: scale(0.97); }
.pts-btn.easy { border-color: var(--pts-easy); }
.pts-btn.mid { border-color: var(--pts-mid); }
.pts-btn.hard { border-color: var(--pts-hard); }
.pts-value {
  font-size: 40px;
  color: var(--gold);
  display: block;
  margin-bottom: 4px;
  line-height: 1;
}
.pts-btn.easy .pts-value { color: var(--pts-easy); }
.pts-btn.mid .pts-value { color: var(--pts-mid); }
.pts-btn.hard .pts-value { color: var(--pts-hard); }
.pts-label {
  font-family: 'Tajawal', sans-serif;
  font-size: 14px;
  color: var(--text-dim);
  font-weight: 700;
}

/* أنماط الفقرات */
.modes-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin: 16px 0;
}
.mode-card {
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: 16px;
  padding: 16px 10px;
  text-align: center;
  cursor: pointer;
  transition: all .2s;
}
.mode-card:active { transform: scale(0.97); }
.mode-icon { font-size: 38px; margin-bottom: 8px; }
.mode-name { font-weight: 700; font-size: 15px; margin-bottom: 3px; }
.mode-desc { font-size: 12px; color: var(--text-dim); line-height: 1.4; font-weight: 500; }
.mode-pts { margin-top: 6px; font-size: 12px; color: var(--gold); font-weight: 700; }

/* charades */
.charades-card {
  background: linear-gradient(135deg, var(--purple), #6d28d9);
  border-radius: 24px;
  padding: 40px 20px;
  text-align: center;
  margin: 20px 0;
}
.charades-word {
  font-family: 'Lalezar', sans-serif;
  font-size: 60px;
  color: white;
  margin: 20px 0;
  font-weight: normal;
  text-shadow: 0 4px 12px rgba(0,0,0,0.3);
}
.charades-cat {
  display: inline-block;
  background: rgba(255,255,255,0.25);
  padding: 6px 18px;
  border-radius: 20px;
  font-size: 15px;
  color: white;
  font-weight: 700;
}

.hint-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-right: 4px solid var(--teal);
  border-radius: 12px;
  padding: 14px 16px;
  margin: 10px 0;
  font-size: 16px;
  font-weight: 500;
  line-height: 1.6;
}

.big-image {
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: 16px;
  padding: 30px;
  text-align: center;
  font-size: 120px;
  margin: 16px 0;
  min-height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.big-image img { max-width: 100%; max-height: 280px; border-radius: 8px; }

.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(10,16,32,0.92);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  padding: 20px;
  backdrop-filter: blur(4px);
  animation: fadeIn .25s ease;
}
@keyframes fadeIn { from { opacity:0;} to { opacity:1;} }
.modal-content {
  background: var(--bg-mid);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 24px;
  width: 100%;
  max-width: 440px;
  max-height: 92vh;
  overflow-y: auto;
}

.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-light);
  border: 1px solid var(--gold);
  border-radius: 14px;
  padding: 12px 22px;
  font-weight: 700;
  font-size: 15px;
  z-index: 1000;
  animation: toastIn .3s ease;
}
@keyframes toastIn { from { opacity:0; transform: translate(-50%, 20px);} to { opacity:1; transform: translate(-50%, 0);} }

.fullscreen-btn {
  position: fixed;
  top: 12px;
  left: 12px;
  width: 46px; height: 46px;
  border-radius: 50%;
  background: rgba(232,184,107,0.2);
  border: 1px solid var(--border);
  color: var(--gold);
  font-size: 20px;
  cursor: pointer;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
}

.warning-banner {
  background: linear-gradient(135deg, rgba(245,158,11,0.18), rgba(245,158,11,0.06));
  border: 1px solid rgba(245,158,11,0.4);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 14px;
  color: var(--warn);
  margin-bottom: 16px;
  display: flex;
  gap: 10px;
  line-height: 1.5;
  font-weight: 500;
}

.confetti {
  position: fixed;
  width: 12px; height: 12px;
  pointer-events: none;
  z-index: 999;
  animation: confetti-fall 3s linear forwards;
}
@keyframes confetti-fall {
  0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

.badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 700;
}
.badge-easy { background: rgba(34,197,94,0.22); color: #86efac; }
.badge-mid { background: rgba(245,158,11,0.22); color: #fcd34d; }
.badge-hard { background: rgba(239,68,68,0.22); color: #fca5a5; }

.admin-tabs {
  display: flex;
  gap: 8px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
  overflow-x: auto;
}
.admin-tab {
  padding: 11px 18px;
  background: transparent;
  border: 0;
  border-bottom: 2px solid transparent;
  color: var(--text-dim);
  font-family: inherit;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  font-size: 15px;
}
.admin-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

.question-row {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 10px;
}
.question-row-text { font-size: 15px; font-weight: 700; line-height: 1.6; margin: 6px 0; }
.question-row-answer { font-size: 14px; color: #86efac; font-weight: 500; }

/* تنسيق التمرير */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg-mid); }
::-webkit-scrollbar-thumb { background: var(--gold-dark); border-radius: 4px; }

/* الشاشات الكبيرة جداً */
@media (min-width: 1200px) {
  .app.fullscreen-mode .question-text { font-size: 44px !important; min-height: 220px; }
  .app.fullscreen-mode .answer-btn { font-size: 30px !important; padding: 30px !important; }
  .app.fullscreen-mode .answers-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<div id="app" class="app">
  <button class="fullscreen-btn" onclick="toggleFullscreen()" title="ملء الشاشة" id="fs-btn">⛶</button>
  <div id="screen-container"></div>
</div>

<!-- ملفات الأسئلة -->
<script src="questions/part1.js"></script>
<script src="questions/part2.js"></script>
<script src="questions/part3.js"></script>
<script src="questions/part4.js"></script>
<script src="modes/interactive.js"></script>

<script>
// ============================================================
// إسألني وبجاوبك - Vanilla JS
// ============================================================

const CATEGORIES = [
  { id: 'cities', name: 'مدن وعواصم', icon: '🌆' },

  { id: 'mystery', name: 'ألغاز', icon: '🧩' },
  { id: 'general', name: 'ثقافة عامة', icon: '💡' },
];

const INTERACTIVE_MODES_LIST = [
  { id: 'normal', name: 'سؤال عادي', icon: '❓', desc: 'اختر الصعوبة وأجب' },
  { id: 'charades', name: 'تمثيل', icon: '🎭', desc: 'مثّل والفريق يخمن', pts: 300 },
  { id: 'images', name: 'صورة', icon: '🖼️', desc: 'خمّن من الصورة', pts: 200 },
  { id: 'whoami', name: 'من أنا؟', icon: '🗣️', desc: '3 تلميحات', pts: 400 },
  { id: 'quickfire', name: 'سباق المعلومات', icon: '⏱️', desc: 'أكبر عدد في 60 ث', pts: 50 },
  { id: 'guessfilm', name: 'خمّن الفيلم', icon: '🎬', desc: 'فيلم أو مسلسل', pts: 200 },

// ============================================================

function buildQuestionsDB() {
  const merged = {};
  const parts = [
    window.QUESTIONS_PART1, window.QUESTIONS_PART2,
    window.QUESTIONS_PART3, window.QUESTIONS_PART4
  ].filter(Boolean);

  parts.forEach(p => {
    Object.keys(p).forEach(cat => {
      if (!merged[cat]) merged[cat] = [];
      merged[cat] = merged[cat].concat(p[cat]);
    });
  });

  try {
    const custom = JSON.parse(localStorage.getItem('esalni_v4_custom') || '{}');
    Object.keys(custom).forEach(cat => {
      if (!merged[cat]) merged[cat] = [];
      merged[cat] = merged[cat].concat(custom[cat]);
    });
  } catch(e) { console.warn(e); }

  return merged;
}

function buildModesDB() {
  const modes = window.INTERACTIVE_MODES || {};
  try {
    const customImages = JSON.parse(localStorage.getItem('esalni_v4_mode_images') || '{}');
    if (modes.images) {
      modes.images.forEach((item, idx) => {
        if (customImages[`images_${idx}`]) {
          item.customImg = customImages[`images_${idx}`];
        }
      });
    }
  } catch(e) {}
  return modes;
}

// ============================================================
// وظائف مساعدة
// ============================================================
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showToast(msg) {
  const old = document.querySelector('.toast');
  if (old) old.remove();
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function playSound(type) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    if (type === 'correct') {
      osc.frequency.setValueAtTime(523, ctx.currentTime);
      osc.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
      osc.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
    } else if (type === 'wrong') {
      osc.frequency.setValueAtTime(200, ctx.currentTime);
      osc.frequency.setValueAtTime(150, ctx.currentTime + 0.15);
    } else if (type === 'tick') {
      osc.frequency.setValueAtTime(800, ctx.currentTime);
    } else if (type === 'click') {
      osc.frequency.setValueAtTime(600, ctx.currentTime);
    }
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (type === 'tick' ? 0.05 : 0.3));
    osc.start();
    osc.stop(ctx.currentTime + (type === 'tick' ? 0.06 : 0.4));
  } catch(e) {}
}

function showConfetti() {
  const colors = ['#e8b86b','#2dd4bf','#ef4444','#8b5cf6','#22c55e'];
  for (let i = 0; i < 50; i++) {
    const el = document.createElement('div');
    el.className = 'confetti';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDelay = Math.random() * 0.5 + 's';
    el.style.animationDuration = (2 + Math.random() * 2) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text || '';
  return div.innerHTML;
}

function toggleFullscreen() {
  if (!document.fullscreenElement && !document.webkitFullscreenElement) {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) req.call(el).catch(() => showToast('متصفحك لا يدعم وضع الشاشة الكاملة'));
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (exit) exit.call(document);
  }
}

document.addEventListener('fullscreenchange', () => {
  const app = document.getElementById('app');
  const fsBtn = document.getElementById('fs-btn');
  if (document.fullscreenElement) {
    app.classList.add('fullscreen-mode');
    if (fsBtn) fsBtn.textContent = '⊠';
  } else {
    app.classList.remove('fullscreen-mode');
    if (fsBtn) fsBtn.textContent = '⛶';
  }
});

function navigate(screen) {
  if (State.timerInterval) { clearInterval(State.timerInterval); State.timerInterval = null; }
  State.screen = screen;
  render();
  window.scrollTo(0, 0);

function render() {
  const container = document.getElementById('screen-container');
  let html = '';

  if (State.screen === 'home') html = renderHome();
  else if (State.screen === 'setup') html = renderSetup();
  else if (State.screen === 'play') html = renderPlay();
  else if (State.screen === 'summary') html = renderSummary();
  else if (State.screen === 'admin') html = renderAdmin();
  else if (State.screen === 'about') html = renderAbout();

  container.innerHTML = html;

  // ربط الأحداث بعد الرسم
  attachEventListeners();
}

function attachEventListeners() {
  // أحداث محددة لكل شاشة
  if (State.screen === 'play' && State.game?.stage === 'playing') {
    startTimerIfNeeded();

}

// ============================================================
function initNormalQuestion() {
  const g = State.game;
  const cats = g.categories.filter(c => State.questionsDB[c]);
  let pool = [];
  cats.forEach(catId => {
    const filtered = State.questionsDB[catId].filter(q => (q.pts || 200) === g.currentPts);
    filtered.forEach(q => pool.push({ ...q, categoryId: catId }));
  });

  if (pool.length === 0) {
    cats.forEach(catId => {
      State.questionsDB[catId].forEach(q => pool.push({ ...q, categoryId: catId }));
    });
  }

  const q = pool[Math.floor(Math.random() * pool.length)];
  g.currentItem = { ...q, shuffledAnswers: shuffle([q.a, ...q.wrong]) };
  g.timeLeft = g.timePerQuestion;
  g.selectedAnswer = null;
  g.showAnswer = false;
  g.showHint = false;
}

function renderNormalQuestion() {
  const g = State.game;
  const q = g.currentItem;
  if (!q) return '';
  const cat = CATEGORIES.find(c => c.id === q.categoryId);
  const radius = 45;
  const circumference = 2 * Math.PI * radius;
  const progress = (g.timeLeft / g.timePerQuestion) * circumference;
  const timerClass = g.timeLeft <= 5 ? 'danger' : g.timeLeft <= 15 ? 'warning' : '';
  const ptsClass = g.currentPts === 100 ? 'easy' : g.currentPts === 200 ? 'mid' : 'hard';

  const answersHtml = q.shuffledAnswers.map((ans, idx) => {
    let cls = 'answer-btn';
    if (g.showAnswer) {
      if (ans === q.a) cls += ' correct';
      else if (ans === g.selectedAnswer) cls += ' wrong';
      else cls += ' disabled';
    }
    let prefix = '';
    if (g.showAnswer && ans === q.a) prefix = '✓ ';
    else if (g.showAnswer && ans === g.selectedAnswer) prefix = '✗ ';
    return `<button class="${cls}" onclick="answerNormalByIdx(${idx})">${prefix}${escapeHtml(ans)}</button>`;
  }).join('');

  return `
    <div class="screen">
      <div class="play-header">
        <span class="badge badge-${ptsClass}">${g.currentPts} نقطة</span>
        <div class="play-cat">${cat?.icon || ''} ${cat?.name || ''}</div>
      </div>

      ${renderTeamsRow()}

      <div class="timer-container">
        <div class="timer-circle">
          <svg viewBox="0 0 100 100">
            <circle class="timer-bg" cx="50" cy="50" r="${radius}"/>
            <circle class="timer-fg ${timerClass}" cx="50" cy="50" r="${radius}"
              stroke-dasharray="${circumference}" stroke-dashoffset="${circumference - progress}"/>
          </svg>
          <div class="timer-number">${g.timeLeft}</div>
        </div>
      </div>

      <div class="question-text">${escapeHtml(q.q)}</div>

      ${g.showHint && q.hint ? `<div class="hint-card">💡 ${escapeHtml(q.hint)}</div>` : ''}

      <div class="answers-grid">${answersHtml}</div>

      ${!g.showAnswer && !g.showHint && q.hint ? `
        <button class="btn btn-ghost btn-sm btn-full" onclick="State.game.showHint=true;render()" style="margin-top:8px">
          💡 إظهار تلميح
        </button>
      ` : ''}
    </div>
  `;
}

function answerNormalByIdx(idx) {
  const ans = State.game.currentItem.shuffledAnswers[idx];
  answerNormalQuestion(ans);
}

function answerNormalQuestion(ans) {
  const g = State.game;
  if (g.selectedAnswer || g.showAnswer) return;
  if (State.timerInterval) { clearInterval(State.timerInterval); State.timerInterval = null; }

  g.selectedAnswer = ans;
  g.showAnswer = true;
  const isCorrect = ans === g.currentItem.a;

function initInteractiveMode(modeId) {
  const g = State.game;
  if (modeId === 'charades') {
    const pool = State.modesDB.charades || [];
    g.currentItem = pool[Math.floor(Math.random() * pool.length)];
    g.charadesPhase = 'ready';
    g.timeLeft = 60;
  } else if (modeId === 'whoami') {
    const pool = State.modesDB.whoami || [];
    g.currentItem = pool[Math.floor(Math.random() * pool.length)];
    g.whoamiHints = 1;
    g.showAnswer = false;
  } else if (modeId === 'quickfire') {
    const pool = State.modesDB.quickfire || [];
    g.currentItem = pool[Math.floor(Math.random() * pool.length)];
    g.quickfirePhase = 'ready';
    g.quickfireCount = 0;
    g.timeLeft = 60;
  } else if (modeId === 'guessfilm') {
    const pool = State.modesDB.guessfilm || [];
    const q = pool[Math.floor(Math.random() * pool.length)];
    g.currentItem = { ...q, shuffledOptions: shuffle(q.options) };
    g.timeLeft = 45;
    g.selectedAnswer = null;
    g.showAnswer = false;
  } else if (modeId === 'images') {
    const pool = State.modesDB.images || [];
    const q = pool[Math.floor(Math.random() * pool.length)];
    g.currentItem = { ...q, shuffledOptions: shuffle(q.options) };
    g.timeLeft = 45;
    g.selectedAnswer = null;
    g.showAnswer = false;
    g.showHint = false;
  }
}

      <div class="card" style="text-align:center;margin-bottom:16px;padding:12px">
        <div style="font-size:14px;color:var(--text-dim);font-weight:500">إن فزت: +${g.riskBet * 2} | إن خسرت: -${g.riskBet}</div>
      </div>

      <div class="timer-container">
        <div class="timer-circle">
          <svg viewBox="0 0 100 100">
            <circle class="timer-bg" cx="50" cy="50" r="45"/>
            <circle class="timer-fg ${g.timeLeft <= 5 ? 'danger' : ''}" cx="50" cy="50" r="45"
              stroke-dasharray="${circ}" stroke-dashoffset="${circ - (g.timeLeft / 40) * circ}"/>
          </svg>
          <div class="timer-number">${g.timeLeft}</div>
        </div>

}

function placeBet(amount) {
  playSound('click');
  const g = State.game;
  g.riskBet = amount;
  // اختر سؤال صعب
  const cats = g.categories.filter(c => State.questionsDB[c]);
  let pool = [];
  cats.forEach(catId => {
    const filtered = State.questionsDB[catId].filter(q => (q.pts || 200) >= 200);
    filtered.forEach(q => pool.push({ ...q, categoryId: catId }));
  });
  const q = pool[Math.floor(Math.random() * pool.length)];
  g.currentItem = { ...q, shuffledAnswers: shuffle([q.a, ...q.wrong]) };
  g.timeLeft = 40;
  g.selectedAnswer = null;
  g.showAnswer = false;
  render();
}

function answerRiskByIdx(idx) {
  const ans = State.game.currentItem.shuffledAnswers[idx];
  answerRisk(ans);
}

function answerRisk(ans) {
  const g = State.game;
  if (g.selectedAnswer || g.showAnswer) return;
  if (State.timerInterval) { clearInterval(State.timerInterval); State.timerInterval = null; }

  g.selectedAnswer = ans;
  g.showAnswer = true;
  const isCorrect = ans === g.currentItem.a;

  if (isCorrect) { playSound('correct'); showConfetti(); }
  else playSound('wrong');

  render();
  setTimeout(() => {
    const pts = isCorrect ? g.riskBet * 2 : -g.riskBet;
    nextRound(pts, 'risk');
  }, 1800);
}

// ============================================================
// مؤقت السؤال العادي + خمن الفيلم + الصور + الرهان
// ============================================================
function startTimerIfNeeded() {
  const g = State.game;
  if (!g) return;
  const needsTimer = ['normal', 'guessfilm', 'images'].includes(g.currentMode) ||
                     (g.currentMode === 'risk' && g.riskBet > 0);
  if (!needsTimer) return;
  if (g.showAnswer) return;
  if (State.timerInterval) return;

  State.timerInterval = setInterval(() => {
    g.timeLeft--;
    if (g.timeLeft <= 6 && g.timeLeft > 0) playSound('tick');
    if (g.timeLeft <= 0) {
      clearInterval(State.timerInterval);
      State.timerInterval = null;
      g.showAnswer = true;
      playSound('wrong');
      render();
      setTimeout(() => {
        if (g.currentMode === 'normal') nextRound(0, 'normal');
        else if (g.currentMode === 'guessfilm') nextRound(0, 'guessfilm');
        else if (g.currentMode === 'images') nextRound(0, 'images');
        else if (g.currentMode === 'risk') nextRound(-g.riskBet, 'risk');
      }, 2000);
      return;
    }
    // تحديث جزئي بدون إعادة رسم
    const timerEl = document.querySelector('.timer-number');
    const timerFg = document.querySelector('.timer-fg');
    if (timerEl) timerEl.textContent = g.timeLeft;
    if (timerFg) {
      const circ = 2 * Math.PI * 45;
      const total = g.currentMode === 'normal' ? g.timePerQuestion :
                    g.currentMode === 'risk' ? 40 : 45;
      timerFg.setAttribute('stroke-dashoffset', circ - (g.timeLeft / total) * circ);
      if (g.timeLeft <= 5) {
        timerFg.classList.remove('warning'); timerFg.classList.add('danger');
      } else if (g.timeLeft <= 15) {
        timerFg.classList.add('warning');
      }
    }
  }, 1000);
}

// ============================================================
// نهاية الجولة
// ============================================================
function nextRound(pts, mode) {
  if (State.timerInterval) { clearInterval(State.timerInterval); State.timerInterval = null; }
  const g = State.game;
  g.teams[g.currentTeam].score = Math.max(0, g.teams[g.currentTeam].score + pts);
  g.history.push({ mode, pts, team: g.currentTeam });

  g.currentRound++;
  if (g.currentRound >= g.totalRounds) {
    navigate('summary');
    return;
  }

  g.currentTeam = (g.currentTeam + 1) % g.teams.length;
  g.stage = 'select-mode';
  g.currentMode = null;
  g.currentPts = null;
  g.currentItem = null;
  g.selectedAnswer = null;
  g.showAnswer = false;
  g.showHint = false;
  g.riskBet = 0;
  render();
}

function renderSummary() {
  const g = State.game;

  const sorted = [...g.teams].sort((a, b) => b.score - a.score);

  const isTie = sorted.length > 1 && sorted[0].score === sorted[1].score;

  return `

function editQuestion(idx) {
  const q = State.questionsDB[adminState.selectedCat][idx];
  adminState.editingIdx = idx;
  adminState.editForm = {
    q: q.q, a: q.a,
    wrong: [...(q.wrong || ['','',''])],
    hint: q.hint || '',
    pts: q.pts || 200
  };
  render();
}

function addNewQuestion() {
  adminState.editingIdx = 'new';
  adminState.editForm = { q: '', a: '', wrong: ['','',''], hint: '', pts: 200 };
  render();
}

function closeEditModal() {
  adminState.editingIdx = null;
  adminState.editForm = null;
  render();
}

function saveEditModal() {
  const f = {
    q: document.getElementById('ef-q').value.trim(),
    a: document.getElementById('ef-a').value.trim(),
    wrong: [
      document.getElementById('ef-w0').value.trim(),
      document.getElementById('ef-w1').value.trim(),
      document.getElementById('ef-w2').value.trim(),
    ],
    hint: document.getElementById('ef-hint').value.trim(),
    pts: parseInt(document.getElementById('ef-pts').value),
  };

  if (!f.q || !f.a) {
    showToast('السؤال والإجابة مطلوبان');
    return;
  }

  const cat = adminState.selectedCat;
  if (!State.questionsDB[cat]) State.questionsDB[cat] = [];

  if (adminState.editingIdx === 'new') {
    State.questionsDB[cat].push(f);
  } else {
    State.questionsDB[cat][adminState.editingIdx] = f;
  }

  saveCustom();
  closeEditModal();
}

function deleteQuestion(idx) {
  if (!confirm('حذف هذا السؤال نهائياً؟')) return;
  State.questionsDB[adminState.selectedCat].splice(idx, 1);
  saveCustom();
  render();
}

function saveCustom() {
  try {
    localStorage.setItem('esalni_v4_custom', JSON.stringify(State.questionsDB));
    showToast('تم الحفظ ✓');
  } catch(e) { showToast('فشل الحفظ'); }
}

function uploadModeImage(event, idx) {
  const file = event.target.files[0];
  if (!file) return;
  if (file.size > 500 * 1024) {
    showToast('الصورة كبيرة - الحد الأقصى 500KB');
    return;
  }
  const reader = new FileReader();
  reader.onload = (evt) => {
    const dataUrl = evt.target.result;
    try {
      const stored = JSON.parse(localStorage.getItem('esalni_v4_mode_images') || '{}');
      stored[`images_${idx}`] = dataUrl;
      localStorage.setItem('esalni_v4_mode_images', JSON.stringify(stored));
      State.modesDB.images[idx].customImg = dataUrl;
      showToast('تم رفع الصورة ✓');
      render();
    } catch(e) {
      showToast('فشل الحفظ - localStorage ممتلئ');
    }
  };
  reader.readAsDataURL(file);
}

function exportData() {
  const data = { questions: State.questionsDB, modes: State.modesDB };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `esalni-${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('تم التصدير ✓');
}

function resetAll() {
  if (!confirm('حذف كل التعديلات والصور المرفوعة؟')) return;
  localStorage.removeItem('esalni_v4_custom');
  localStorage.removeItem('esalni_v4_mode_images');
  location.reload();
}
