<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a0033">
<title>سؤال المجلس — لعبة المسابقات</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23e89e54'/%3E%3Cstop offset='100%25' stop-color='%23cc5500'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='6' y='6' width='88' height='88' rx='20' fill='url(%23g)'/%3E%3Cg transform='translate(20,20)' fill='white'%3E%3Crect x='0' y='0' width='14' height='14' rx='2' opacity='0.95'/%3E%3Crect x='16' y='0' width='14' height='14' rx='2' opacity='0.55'/%3E%3Crect x='32' y='0' width='14' height='14' rx='2' opacity='0.55'/%3E%3Crect x='48' y='0' width='14' height='14' rx='2' opacity='0.95'/%3E%3Crect x='0' y='16' width='14' height='14' rx='2' opacity='0.55'/%3E%3Crect x='48' y='16' width='14' height='14' rx='2' opacity='0.55'/%3E%3Crect x='0' y='32' width='14' height='14' rx='2' opacity='0.55'/%3E%3Crect x='48' y='32' width='14' height='14' rx='2' opacity='0.55'/%3E%3Crect x='0' y='48' width='14' height='14' rx='2' opacity='0.95'/%3E%3Crect x='16' y='48' width='14' height='14' rx='2' opacity='0.55'/%3E%3Crect x='32' y='48' width='14' height='14' rx='2' opacity='0.55'/%3E%3Crect x='48' y='48' width='14' height='14' rx='2' opacity='0.95'/%3E%3C/g%3E%3C/svg%3E">

<style>
:root {
  /* Arena Mode - نحاسي ذهبي درامي على أسود فاخر */
  --bronze: #d68a3c;
  --bronze-light: #f0a85a;
  --bronze-deep: #9c5f24;
  --copper: #c47a35;
  --gold-warm: #e8b864;
  --gold-bright: #f5c98a;
  --burnt-orange: #d65a1a;
  --burnt-light: #ef7328;
  --plum: #1f1228;
  --plum-light: #38223f;
  --bg-royal: #161019;
  --bg-deep: #0a0710;
  --bg-abyss: #050308;
  --bg-card: rgba(240, 168, 90, 0.06);
  --bg-card-hover: rgba(240, 168, 90, 0.13);
  --bg-glass: rgba(22, 16, 25, 0.72);
  --border-warm: rgba(214, 138, 60, 0.32);
  --border-strong: rgba(240, 168, 90, 0.65);
  --glow-bronze: rgba(214, 138, 60, 0.45);
  --text: #fdf2e4;
  --text-warm: #f4d8a8;
  --text-dim: #c9a878;
  --text-mute: #8b7355;
  --success: #3ddc84;
  --success-bg: rgba(61, 220, 132, 0.18);
  --danger: #f87171;
  --danger-bg: rgba(248, 113, 113, 0.15);
  --warn: #fbbf24;
}

/* الثيم البناتي - Arena Mode وردي درامي على أسود */
body.theme-girls {
  --bronze: #e87bb0;
  --bronze-light: #f5a3cc;
  --bronze-deep: #b54d85;
  --copper: #d97e9b;
  --gold-warm: #f0a5c4;
  --gold-bright: #ffc9e0;
  --burnt-orange: #d6256b;
  --burnt-light: #ef3d87;
  --plum: #2a1020;
  --plum-light: #421a33;
  --bg-royal: #1a0f16;
  --bg-deep: #0f070c;
  --bg-abyss: #080406;
  --bg-card: rgba(245, 163, 204, 0.07);
  --bg-card-hover: rgba(245, 163, 204, 0.15);
  --bg-glass: rgba(26, 15, 22, 0.72);
  --border-warm: rgba(232, 123, 176, 0.36);
  --border-strong: rgba(245, 163, 204, 0.7);
  --glow-bronze: rgba(232, 123, 176, 0.45);
  --text: #fff5fa;
  --text-warm: #fcd8eb;
  --text-dim: #e0a8c8;
  --text-mute: #a08294;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

/* ========== Arena Mode - نظام المشاهد والزجاج ========== */
.scene-container {
  position: relative;
  border-radius: 28px;
  overflow: hidden;
  margin-bottom: 18px;
  border: 1px solid var(--border-warm);
  box-shadow: 0 20px 50px -16px rgba(0,0,0,0.7), inset 0 1px 0 rgba(240,168,90,0.15);
}
.scene-svg {
  display: block;
  width: 100%;
  height: 200px;
  object-fit: cover;
}
.scene-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: linear-gradient(180deg, rgba(10,7,16,0.1) 0%, rgba(10,7,16,0.55) 70%, rgba(10,7,16,0.85) 100%);
  text-align: center;
  padding: 20px;
}
.banner-svg {
  display: block;
  width: 100%;
  height: 70px;
}

/* بطاقة زجاجية Arena */
.glass-card {
  background: var(--bg-glass);
  backdrop-filter: blur(20px) saturate(140%);
  -webkit-backdrop-filter: blur(20px) saturate(140%);
  border: 1px solid var(--border-warm);
  border-radius: 20px;
  box-shadow: 0 12px 36px -12px rgba(0,0,0,0.6), inset 0 1px 0 rgba(240,168,90,0.12);
  transition: all .3s cubic-bezier(.22,1,.36,1);
}
.glass-card:hover {
  border-color: var(--border-strong);
  box-shadow: 0 16px 44px -12px var(--glow-bronze), inset 0 1px 0 rgba(240,168,90,0.2);
}

/* بطاقة اللعب السريع - بارزة درامياً */
.arena-primary-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 18px;
  border-radius: 20px;
  background: linear-gradient(135deg, rgba(214,138,60,0.2), rgba(214,138,60,0.06));
  border: 1px solid var(--border-strong);
  cursor: pointer;
  transition: all .3s cubic-bezier(.22,1,.36,1);
  position: relative;
  overflow: hidden;
}
.arena-primary-card::before {
  content: '';
  position: absolute;
  top: 0; left: -120%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(245,201,138,0.18), transparent);
  transition: left .6s;
}
.arena-primary-card:hover::before { left: 120%; }
.arena-primary-card:active { transform: scale(0.98); }
.arena-icon-badge {
  width: 48px; height: 48px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--bronze-light), var(--burnt-orange));
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 6px 18px -4px var(--glow-bronze);
}
.arena-icon-badge svg { width: 26px; height: 26px; }

/* شبكة بطاقات Arena الثانوية */
.arena-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 10px;
}
.arena-tile {
  padding: 16px 12px;
  border-radius: 16px;
  background: var(--bg-card);
  border: 1px solid var(--border-warm);
  text-align: center;
  cursor: pointer;
  transition: all .25s cubic-bezier(.22,1,.36,1);
  backdrop-filter: blur(10px);
}
.arena-tile:hover {
  background: var(--bg-card-hover);
  border-color: var(--border-strong);
  transform: translateY(-2px);
}
.arena-tile:active { transform: scale(0.97); }
.arena-tile-icon {
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 8px; color: var(--bronze-light);
}
.arena-tile-title { color: var(--text); font-weight: 700; font-size: 13px; }
.arena-tile-desc { color: var(--text-mute); font-size: 11px; margin-top: 2px; }

/* شارة العدد في المشهد */
.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 12px;
  padding: 6px 16px;
  border-radius: 20px;
  background: rgba(214,138,60,0.18);
  border: 1px solid var(--border-strong);
  color: var(--bronze-light);
  font-size: 12px;
  font-weight: 700;
  backdrop-filter: blur(8px);
}

/* اسم سؤال المجلس تحت الرقم 36 */
.brand-subname {
  font-family: 'IBM Plex Sans Arabic', sans-serif;
  font-weight: 700;
  font-size: 22px;
  background: linear-gradient(135deg, var(--gold-bright), var(--bronze-light));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 0.5px;
  margin-bottom: 2px;
}

/* شريط اللعبة العلوي - زر رجوع + المؤشر */
.game-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  gap: 10px;
}
.btn-home-exit {
  width: 42px;
  height: 42px;
  border-radius: 13px;
  background: var(--bg-glass);
  border: 1px solid var(--border-warm);
  color: var(--bronze-light);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all .2s;
  backdrop-filter: blur(12px);
  flex-shrink: 0;
}
.btn-home-exit:hover {
  background: var(--bg-card-hover);
  border-color: var(--border-strong);
  transform: scale(1.05);
}
.btn-home-exit:active { transform: scale(0.92); }

/* شريط Arena العلوي للشاشات الداخلية */
.arena-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  padding: 12px 16px;
  border-radius: 18px;
  background: var(--bg-glass);
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  border: 1px solid var(--border-warm);
  box-shadow: 0 8px 24px -10px rgba(0,0,0,0.5);
}
.arena-header-title {
  font-family: 'IBM Plex Sans Arabic', sans-serif;
  font-size: 19px;
  font-weight: 700;
  color: var(--text);
  background: linear-gradient(135deg, var(--gold-bright), var(--bronze-light));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}


html, body {
  background: var(--bg-royal);
  color: var(--text);
  font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  font-weight: 500;
}

/* خلفية Arena Mode - أسود فاخر بتوهجات نحاسية درامية وعمق */
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 50% 45% at 18% 12%, var(--glow-bronze) 0%, transparent 55%),
    radial-gradient(ellipse 60% 55% at 85% 88%, rgba(214, 90, 26, 0.22) 0%, transparent 58%),
    radial-gradient(ellipse 90% 80% at 50% 45%, rgba(56, 34, 63, 0.5) 0%, transparent 72%),
    linear-gradient(165deg, var(--bg-royal) 0%, var(--bg-deep) 60%, var(--bg-abyss) 100%);
  z-index: -2;
  pointer-events: none;
}
body.theme-girls::before {
  background:
    radial-gradient(ellipse 50% 45% at 18% 12%, var(--glow-bronze) 0%, transparent 55%),
    radial-gradient(ellipse 60% 55% at 85% 88%, rgba(214, 37, 107, 0.22) 0%, transparent 58%),
    radial-gradient(ellipse 90% 80% at 50% 45%, rgba(66, 26, 51, 0.5) 0%, transparent 72%),
    linear-gradient(165deg, var(--bg-royal) 0%, var(--bg-deep) 60%, var(--bg-abyss) 100%);
}

/* نسيج زخرفي خفيف بنمط شرقي */
body::after {
  content: '';
  position: fixed; inset: 0;
  background-image:
    radial-gradient(circle at 50% 50%, transparent 60%, rgba(0,0,0,0.4) 100%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'><g fill='none' stroke='%23cd7f32' stroke-opacity='0.05' stroke-width='1.5'><path d='M60 10 L80 30 L80 60 L60 80 L40 60 L40 30 Z'/><circle cx='60' cy='45' r='12'/></g></svg>");
  z-index: -1;
  pointer-events: none;
  opacity: 0.6;
}

#app {
  width: 100%;
  margin: 0 auto;
  min-height: 100vh;
  padding: env(safe-area-inset-top) clamp(12px, 4vw, 80px) env(safe-area-inset-bottom);
}

/* ============== RESPONSIVE BREAKPOINTS ============== */

/* Default للجوال: play-layout كعمود طبيعي */
.play-layout { display: flex; flex-direction: column; gap: 0; }
.play-layout .play-left, .play-layout .play-right {
  display: flex;
  flex-direction: column;
  gap: 0;
}
.play-layout .play-left > *, .play-layout .play-right > * { margin-bottom: 12px; }

/* تخطيط الصفحة الرئيسية - عمودين على التابلت والديسكتوب */
.home-layout {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* تخطيط الإعداد بعمودين على التابلت والديسكتوب */
.setup-layout {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* تخطيط الشبكة - يكبر مع الشاشة */
.grid-game { width: 100%; }

/* Tablet portrait (640px+) - توسعة معتدلة */
@media (min-width: 640px) {
  .screen { padding: 28px 24px; }
  .title-xl { font-size: 52px; }
  .title-md { font-size: 32px; }
  .question-text { font-size: 24px; padding: 32px 26px; min-height: 140px; }
  .answer-btn { font-size: 18px; padding: 18px 22px; }
  .pts-btn { padding: 32px 18px; }
  .pts-value { font-size: 50px; }
  .cat-card { padding: 20px 14px; }
  .cat-icon { font-size: 44px; }
  .grid-cell { font-size: 22px; padding: 18px 8px; min-height: 75px; }
  .grid-header-cell { padding: 14px 8px; font-size: 14px; min-height: 90px; }
  .grid-header-cell .icon { font-size: 28px; }
  .team-card { padding: 16px 12px; }
  .team-avatar { font-size: 38px; }
  .team-score { font-size: 36px; }
  .timer-circle { width: 130px; height: 130px; }
  .timer-number { font-size: 46px; }
  .welcome-logo { font-size: 100px; }
  .action-card { padding: 22px; }
  .action-icon { font-size: 42px; }
  .quick-play-card { padding: 30px; }
  .quick-play-icon { font-size: 56px; }
  .quick-play-title { font-size: 24px; }
}

/* Tablet (768px+) - يبدأ التوسع الحقيقي */
@media (min-width: 768px) {
  .screen { padding: 32px 5vw; }
  .categories-grid { grid-template-columns: repeat(3, 1fr); }
  .modes-grid { grid-template-columns: repeat(3, 1fr); }
  .answers-grid { grid-template-columns: repeat(2, 1fr); }
  .grid-cell { font-size: 24px; min-height: 85px; }
  .grid-header-cell { font-size: 15px; }
  .home-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  .quick-play-card { grid-column: 1 / -1; }
  .action-cards { grid-template-columns: repeat(2, 1fr); }
}

/* Desktop (1024px+) - حجم سطح المكتب */
@media (min-width: 1024px) {
  .screen { padding: 40px 6vw; }
  .title-xl { font-size: 60px; }
  .question-text { font-size: 28px; padding: 40px 32px; min-height: 180px; }
  .answer-btn { font-size: 20px; padding: 22px 26px; }
  .pts-grid { grid-template-columns: repeat(3, 1fr); }
  .pts-btn { padding: 40px 20px; min-height: 180px; }
  .pts-value { font-size: 60px; }
  .grid-cell { font-size: 32px; min-height: 110px; padding: 24px 10px; }
  .grid-header-cell { font-size: 18px; min-height: 120px; padding: 20px 10px; }
  .grid-header-cell .icon { font-size: 40px; }
  .categories-grid { grid-template-columns: repeat(4, 1fr); }
  .modes-grid { grid-template-columns: repeat(4, 1fr); }
  .team-card { min-width: 160px; padding: 18px 14px; }
  .team-avatar { font-size: 42px; }
  .team-score { font-size: 40px; }
  .timer-circle { width: 150px; height: 150px; }
  .timer-number { font-size: 54px; }

  /* تخطيط الصفحة الرئيسية بعمودين فعليين */
  .home-layout {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 30px;
    align-items: start;
  }
  .quick-play-card { grid-column: 1 / -1; }
  .action-cards { grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .theme-selector { max-width: 700px; margin-left: auto; margin-right: auto; }

  /* تخطيط شاشة اللعب بعمودين */
  .play-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    align-items: start;
  }
  .play-layout .play-left, .play-layout .play-right {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* تخطيط الإعداد بعمودين */
  .setup-layout {
    display: grid;
    grid-template-columns: 1fr 1.5fr;
    gap: 30px;
    align-items: start;
  }
  .setup-left, .setup-right { display: flex; flex-direction: column; gap: 16px; }
}

/* Large Desktop (1280px+) - تكبير الكل */
@media (min-width: 1280px) {
  .screen { padding: 48px 8vw; }
  .title-xl { font-size: 72px; }
  .grid-cell { font-size: 38px; min-height: 120px; }
  .grid-header-cell { font-size: 20px; min-height: 130px; }
  .question-text { font-size: 32px; min-height: 220px; padding: 48px 36px; }
  .answer-btn { font-size: 22px; padding: 26px 30px; }
  .timer-circle { width: 170px; height: 170px; }
  .timer-number { font-size: 60px; }
  .welcome-logo { font-size: 130px; }
}

/* Extra Large (1536px+) - شاشات HD/4K */
@media (min-width: 1536px) {
  .screen { padding: 56px 10vw; }
  .grid-cell { font-size: 44px; min-height: 140px; padding: 30px 14px; }
  .grid-header-cell { font-size: 24px; min-height: 150px; }
  .grid-header-cell .icon { font-size: 48px; }
  .question-text { font-size: 36px; padding: 56px 40px; min-height: 240px; }
  .answer-btn { font-size: 24px; padding: 30px 34px; }
  .timer-circle { width: 200px; height: 200px; }
  .timer-number { font-size: 72px; }
  .title-xl { font-size: 84px; }
  .pts-value { font-size: 72px; }
  .team-avatar { font-size: 48px; }
  .team-score { font-size: 46px; }
}

/* Ultra Wide (1920px+) - شاشات 4K */
@media (min-width: 1920px) {
  .screen { padding: 64px 12vw; }
  .grid-cell { font-size: 48px; min-height: 160px; }
  .grid-header-cell { font-size: 26px; min-height: 170px; }
  .question-text { font-size: 40px; min-height: 280px; }
  .answer-btn { font-size: 26px; padding: 34px 38px; }
}

.app.fullscreen-mode { max-width: 100%; }
.app.fullscreen-mode .screen { padding: 32px 48px; }

/* وضع ملء الشاشة عبر CSS - للجوال (iPhone خاصة) */
body.css-fullscreen {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
body.css-fullscreen .app { max-width: 100%; min-height: 100vh; }
@media (max-width: 768px) {
  .app.fullscreen-mode .screen { padding: 20px 16px; }
}
.app.fullscreen-mode .title-xl { font-size: 64px !important; }
.app.fullscreen-mode .question-text { font-size: 36px !important; padding: 40px !important; min-height: 220px; }
.app.fullscreen-mode .answer-btn { font-size: 26px !important; padding: 26px !important; min-height: 80px; }
.app.fullscreen-mode .timer-circle { width: 180px !important; height: 180px !important; }
.app.fullscreen-mode .timer-number { font-size: 64px !important; }
.app.fullscreen-mode .team-name { font-size: 26px !important; }
.app.fullscreen-mode .team-score { font-size: 56px !important; }
.app.fullscreen-mode .grid-cell { padding: 22px !important; font-size: 28px !important; }
.app.fullscreen-mode .grid-header-cell { font-size: 22px !important; padding: 16px 10px !important; }

.screen {
  padding: 20px 16px;
  min-height: 100vh;
  animation: screenEnter .45s cubic-bezier(.22,1,.36,1);
}
@keyframes screenEnter {
  from { opacity:0; transform: translateY(20px) scale(0.99); }
  to { opacity:1; transform: translateY(0) scale(1); }
}
@keyframes slideIn { from { opacity:0; transform: translateY(15px);} to { opacity:1; transform: translateY(0);} }
@keyframes fadeIn { from { opacity:0;} to { opacity:1;} }
@keyframes scaleIn { from { opacity:0; transform: scale(0.92);} to { opacity:1; transform: scale(1);} }
@keyframes float { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-10px);} }
@keyframes shimmer { 0% { background-position: -200% 0;} 100% { background-position: 200% 0;} }
@keyframes pulse-glow { 0%,100% { box-shadow: 0 0 0 0 rgba(205,127,50,0.4);} 50% { box-shadow: 0 0 0 12px rgba(205,127,50,0);} }

/* ========== الأزرار - فخمة وجريئة ========== */
.btn {
  font-family: inherit;
  font-weight: 600;
  border: 0;
  cursor: pointer;
  padding: 16px 26px;
  border-radius: 14px;
  font-size: 17px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all .25s cubic-bezier(.4,0,.2,1);
  user-select: none;
  position: relative;
  overflow: hidden;
}
.btn-primary {
  background: linear-gradient(135deg, var(--bronze) 0%, var(--bronze-deep) 100%);
  color: #fff;
  box-shadow:
    0 8px 24px -6px rgba(205, 127, 50, 0.5),
    inset 0 1px 0 0 rgba(255, 215, 170, 0.4);
}
.btn-primary::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  transition: left .5s;
}
.btn-primary:hover::before { left: 100%; }
.btn-primary:active { transform: scale(0.97); }
.btn-secondary {
  background: var(--bg-card);
  color: var(--bronze-light);
  border: 1.5px solid var(--border-warm);
  backdrop-filter: blur(10px);
}
.btn-secondary:hover { background: var(--bg-card-hover); border-color: var(--border-strong); }
.btn-danger {
  background: var(--danger-bg);
  color: #fca5a5;
  border: 1.5px solid rgba(248,113,113,0.4);
}
.btn-ghost {
  background: transparent;
  color: var(--text-dim);
  border: 1.5px solid var(--border-warm);
}
.btn-sm { padding: 10px 18px; font-size: 14px; border-radius: 11px; }
.btn-full { width: 100%; }

/* زر المشاركة الرئيسي - بارز وجذاب */
.btn-share {
  background: linear-gradient(135deg, #06b6d4 0%, #0891b2 50%, #0e7490 100%);
  color: #fff;
  box-shadow:
    0 8px 24px -6px rgba(6, 182, 212, 0.5),
    inset 0 1px 0 0 rgba(255, 255, 255, 0.3);
  font-weight: 700;
  position: relative;
  overflow: hidden;
}
.btn-share::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
  animation: shimmer 2.5s infinite;
}
.btn-share:hover { transform: translateY(-1px); }
.btn-share:active { transform: scale(0.97); }

/* زر واتساب */
.btn-whatsapp {
  background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
  color: #fff;
  font-family: inherit;
  font-weight: 700;
  border: 0;
  padding: 16px 22px;
  border-radius: 14px;
  font-size: 16px;
  cursor: pointer;
  transition: all .2s;
  box-shadow: 0 6px 20px -6px rgba(37, 211, 102, 0.5);
}
.btn-whatsapp:hover { transform: translateY(-1px); }
.btn-whatsapp:active { transform: scale(0.97); }

/* ========== البطاقات - Glass-morphism ========== */
.card {
  background: var(--bg-glass);
  border: 1px solid var(--border-warm);
  border-radius: 20px;
  padding: 20px;
  backdrop-filter: blur(18px) saturate(130%);
  -webkit-backdrop-filter: blur(18px) saturate(130%);
  box-shadow: 0 10px 30px -12px rgba(0,0,0,0.5), inset 0 1px 0 rgba(240,168,90,0.1);
}

/* ========== الخطوط ========== */
h1, h2, h3 { font-family: 'IBM Plex Sans Arabic', sans-serif; font-weight: 700; }

.title-xl {
  font-family: 'IBM Plex Sans Arabic', sans-serif;
  font-size: 44px;
  background: linear-gradient(135deg, var(--bronze-light) 0%, var(--gold-warm) 50%, var(--bronze) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-align: center;
  margin: 16px 0 8px;
  font-weight: 700;
  letter-spacing: -0.5px;
  line-height: 1.2;
}
.title-md {
  font-family: 'IBM Plex Sans Arabic', sans-serif;
  font-size: 28px;
  color: var(--bronze-light);
  font-weight: 700;
  letter-spacing: -0.3px;
}
.title-sm {
  font-family: 'IBM Plex Sans Arabic', sans-serif;
  font-size: 20px;
  color: var(--text);
  font-weight: 700;
}
.subtitle {
  text-align: center;
  color: var(--text-dim);
  font-size: 15px;
  margin-bottom: 24px;
  font-weight: 500;
}

.brand-name {
  font-family: 'Inter', 'IBM Plex Sans Arabic', sans-serif;
  font-weight: 900;
  letter-spacing: -0.04em;
  background: linear-gradient(135deg, var(--bronze-light) 0%, var(--gold-warm) 50%, var(--bronze) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 0.95;
}

.brand-name-xl { font-size: 96px; }
.brand-name-lg { font-size: 64px; }
.brand-name-md { font-size: 42px; }
.brand-name-sm { font-size: 28px; }

.brand-tagline {
  font-family: 'IBM Plex Sans Arabic', sans-serif;
  font-size: 14px;
  color: var(--bronze-light);
  font-weight: 600;
  letter-spacing: 0.05em;
  text-align: center;
  margin-top: 4px;
  opacity: 0.85;
}

.logo-36 {
  display: inline-block;
  filter: drop-shadow(0 8px 24px rgba(205,127,50,0.45));
  animation: float 4s ease-in-out infinite;
}
.logo-36-static { animation: none; }

.logo-row {
  display: flex;
  align-items: center;
  gap: 14px;
  justify-content: center;
}
.logo-row .logo-text {
  text-align: right;
}

input, textarea, select {
  width: 100%;
  background: var(--bg-card);
  border: 1.5px solid var(--border-warm);
  color: var(--text);
  padding: 14px 16px;
  border-radius: 14px;
  font-family: inherit;
  font-size: 16px;
  font-weight: 500;
  outline: none;
  transition: all .2s;
  backdrop-filter: blur(8px);
}
input:focus, textarea:focus, select:focus {
  border-color: var(--bronze);
  background: var(--bg-card-hover);
  box-shadow: 0 0 0 3px rgba(205,127,50,0.18);
}
label { display: block; font-size: 14px; color: var(--text-warm); margin-bottom: 8px; font-weight: 600; }

/* ========== شاشة اختيار الثيم ========== */
.theme-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 30px 0; }
.theme-option {
  background: var(--bg-card);
  border: 2.5px solid var(--border-warm);
  border-radius: 24px;
  padding: 26px 16px;
  text-align: center;
  cursor: pointer;
  transition: all .3s;
  backdrop-filter: blur(12px);
}
.theme-option:active { transform: scale(0.96); }
.theme-option.selected {
  border-color: var(--bronze);
  box-shadow:
    0 0 0 4px rgba(205,127,50,0.2),
    0 12px 40px -8px rgba(205,127,50,0.5);
  transform: scale(1.03);
}
.theme-icon { font-size: 70px; margin-bottom: 14px; }
.theme-name {
  font-family: 'IBM Plex Sans Arabic', sans-serif;
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 6px;
}
.theme-desc { font-size: 13px; color: var(--text-dim); font-weight: 500; }

/* ========== Onboarding ========== */
.onboarding {
  text-align: center;
  padding: 40px 20px;
  min-height: 80vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.onboarding-icon { font-size: 110px; margin-bottom: 28px; animation: float 4s ease-in-out infinite; }
.onboarding-title {
  font-family: 'IBM Plex Sans Arabic', sans-serif;
  font-size: 32px;
  background: linear-gradient(135deg, var(--bronze-light), var(--gold-warm));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 18px;
  font-weight: 700;
}
.onboarding-desc { color: var(--text-warm); font-size: 17px; line-height: 1.8; margin-bottom: 32px; font-weight: 500; }
.onboarding-dots { display: flex; justify-content: center; gap: 10px; margin-bottom: 28px; }
.onboarding-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bg-card); transition: all .25s; }
.onboarding-dot.active {
  background: var(--bronze);
  width: 32px;
  border-radius: 5px;
  box-shadow: 0 0 12px var(--bronze);
}

/* ========== الصفحة الرئيسية ========== */
.welcome-hero { text-align: center; padding: 32px 0 20px; }
.welcome-logo {
  font-size: 90px;
  margin-bottom: 14px;
  filter: drop-shadow(0 8px 30px rgba(205,127,50,0.7));
  animation: float 4s ease-in-out infinite;
}

.action-cards { display: grid; gap: 12px; margin-top: 24px; }
.action-card {
  background: var(--bg-card);
  border: 1.5px solid var(--border-warm);
  border-radius: 18px;
  padding: 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  cursor: pointer;
  transition: all .25s;
  backdrop-filter: blur(12px);
  position: relative;
  overflow: hidden;
}
.action-card::before {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 4px;
  height: 100%;
  background: linear-gradient(180deg, var(--bronze), var(--burnt-orange));
  opacity: 0;
  transition: opacity .25s;
}
.action-card:hover::before { opacity: 1; }
.action-card:hover { background: var(--bg-card-hover); border-color: var(--border-strong); }
.action-card:active { transform: scale(0.98); }
.action-icon { font-size: 38px; }
.action-info { flex: 1; text-align: right; }
.action-title { font-family: 'IBM Plex Sans Arabic', sans-serif; font-weight: 700; font-size: 18px; margin-bottom: 4px; }
.action-desc { font-size: 13px; color: var(--text-dim); font-weight: 500; line-height: 1.5; }
.action-arrow { color: var(--bronze); font-size: 24px; }

.quick-play-card {
  background: linear-gradient(135deg, var(--bronze) 0%, var(--burnt-orange) 100%);
  border-radius: 22px;
  padding: 26px;
  display: flex;
  align-items: center;
  gap: 16px;
  cursor: pointer;
  transition: all .25s;
  box-shadow: 0 12px 40px -8px rgba(205,127,50,0.6);
  margin-top: 22px;
  position: relative;
  overflow: hidden;
}

/* بطاقة استئناف اللعبة */
.resume-card {
  background: linear-gradient(135deg, var(--success) 0%, #0d8a5f 100%);
  border-radius: 22px;
  padding: 22px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  cursor: pointer;
  transition: all .25s;
  box-shadow: 0 12px 40px -8px rgba(52, 211, 153, 0.5);
  margin: 16px 0 22px;
  position: relative;
  overflow: hidden;
  animation: pulse-glow-resume 2.5s infinite;
}
@keyframes pulse-glow-resume {
  0%,100% { box-shadow: 0 12px 40px -8px rgba(52, 211, 153, 0.5); }
  50% { box-shadow: 0 12px 50px -4px rgba(52, 211, 153, 0.8); }
}
.resume-card::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.18) 50%, transparent 70%);
  background-size: 200% 100%;
  animation: shimmer 3s infinite;
}
.resume-card:active { transform: scale(0.98); }
.resume-icon { font-size: 44px; position: relative; z-index: 1; }
.resume-info { flex: 1; text-align: right; color: #fff; position: relative; z-index: 1; }
.resume-title { font-family: 'IBM Plex Sans Arabic', sans-serif; font-weight: 700; font-size: 20px; margin-bottom: 6px; }
.resume-desc { font-size: 13px; opacity: 0.95; font-weight: 500; line-height: 1.6; }
.resume-arrow { color: #fff; font-size: 26px; opacity: 0.9; position: relative; z-index: 1; }

/* تأثيرات النتائج النهائية */
@keyframes score-count {
  from { opacity: 0; transform: scale(0.5) translateY(20px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes winner-bounce {
  0%,100% { transform: translateY(0); }
  25% { transform: translateY(-15px); }
  50% { transform: translateY(0); }
  75% { transform: translateY(-8px); }
}
.summary-trophy { animation: winner-bounce 1.5s ease-in-out 0.5s 2; display: inline-block; }
.summary-place { animation: score-count 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) backwards; }
.summary-place:nth-child(1) { animation-delay: 0.2s; }
.summary-place:nth-child(2) { animation-delay: 0.4s; }
.summary-place:nth-child(3) { animation-delay: 0.6s; }
.summary-place:nth-child(4) { animation-delay: 0.8s; }
.summary-place:nth-child(5) { animation-delay: 1.0s; }
.summary-place:nth-child(6) { animation-delay: 1.2s; }
.summary-score-anim {
  font-family: 'IBM Plex Sans Arabic', sans-serif;
  background: linear-gradient(135deg, var(--bronze-light), var(--bronze));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 700;
}
.quick-play-card::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(45deg, transparent 30%, rgba(255,255,255,0.15) 50%, transparent 70%);
  background-size: 200% 100%;
  animation: shimmer 3s infinite;
}
.quick-play-card:active { transform: scale(0.98); }
.quick-play-icon { font-size: 50px; position: relative; z-index: 1; }
.quick-play-info { flex: 1; text-align: right; color: #fff; position: relative; z-index: 1; }
.quick-play-title { font-family: 'IBM Plex Sans Arabic', sans-serif; font-weight: 700; font-size: 22px; margin-bottom: 4px; }
.quick-play-desc { font-size: 13px; opacity: 0.92; font-weight: 500; }

/* ========== الشبكة 6x6 - النظام الجديد ========== */
.grid-game {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 5px;
  margin: 16px 0;
  direction: rtl;
}
.grid-header-cell {
  background: linear-gradient(135deg, var(--bg-card-hover), var(--bg-card));
  border: 1.5px solid var(--border-warm);
  border-radius: 12px;
  padding: 12px 6px;
  text-align: center;
  font-family: 'IBM Plex Sans Arabic', sans-serif;
  font-weight: 700;
  font-size: 13px;
  color: var(--bronze-light);
  min-height: 80px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.grid-header-cell .icon { font-size: 24px; }
.grid-header-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 4px;
}
.grid-header-icon svg {
  filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
  transition: transform .2s;
}
.grid-header-cell:hover .grid-header-icon svg { transform: scale(1.1); }
.cat-icon-svg {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 8px;
  height: 44px;
}
.cat-icon-svg svg {
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.25));
  transition: transform .25s, filter .25s;
}
.cat-card:hover .cat-icon-svg svg {
  transform: scale(1.1);
  filter: drop-shadow(0 6px 12px rgba(0,0,0,0.4));
}
.cat-card.selected .cat-icon-svg svg {
  transform: scale(1.15);
}
.grid-cell {
  background: var(--bg-card);
  border: 1.5px solid var(--border-warm);
  border-radius: 12px;
  padding: 14px 6px;
  text-align: center;
  font-family: 'IBM Plex Sans Arabic', sans-serif;
  font-weight: 700;
  font-size: 18px;
  color: var(--bronze-light);
  cursor: pointer;
  transition: all .25s;
  min-height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  backdrop-filter: blur(8px);
}
.grid-cell:hover:not(.used) {
  background: var(--bg-card-hover);
  border-color: var(--bronze);
  transform: scale(1.08);
  box-shadow: 0 6px 20px -6px var(--bronze);
}
.grid-cell:active { transform: scale(0.95); }
.grid-cell.used {
  background: rgba(0,0,0,0.3);
  border-color: rgba(205,127,50,0.1);
  color: var(--text-mute);
  cursor: not-allowed;
  opacity: 0.4;
}
.grid-cell.used::after {
  content: '✗';
  position: absolute;
  font-size: 32px;
  color: var(--danger);
  opacity: 0.6;
}

/* ========== الفئات ========== */
.categories-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}
.cat-card {
  background: var(--bg-card);
  border: 2px solid var(--border-warm);
  border-radius: 18px;
  padding: 18px 12px;
  text-align: center;
  cursor: pointer;
  transition: all .25s;
  backdrop-filter: blur(10px);
  position: relative;
  overflow: hidden;
}
.cat-card::before {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 5px;
  height: 100%;
  background: var(--cat-color, var(--bronze));
}
.cat-card:active { transform: scale(0.96); }
.cat-card.selected {
  background: var(--bg-card-hover);
  border-color: var(--cat-color, var(--bronze));
  box-shadow:
    0 0 0 2px var(--cat-color, var(--bronze)),
    0 8px 24px -8px var(--cat-color, var(--bronze));
}
.cat-icon { font-size: 40px; margin-bottom: 8px; display: block; }
.cat-name { font-weight: 700; font-size: 15px; color: var(--text); }
.cat-count { font-size: 12px; color: var(--text-mute); margin-top: 4px; font-weight: 500; }

.cat-selection-info {
  background: var(--bg-card);
  border: 1.5px solid var(--border-warm);
  border-radius: 14px;
  padding: 14px 16px;
  text-align: center;
  margin-bottom: 16px;
  font-weight: 600;
  font-size: 15px;
  backdrop-filter: blur(8px);
}

/* ========== الفرق ========== */
.teams-row {
  display: flex;
  gap: 10px;
  margin-bottom: 18px;
  overflow-x: auto;
  padding-bottom: 4px;
}
.team-card {
  flex: 1;
  min-width: 130px;
  background: var(--bg-card);
  border: 2.5px solid var(--border-warm);
  border-radius: 16px;
  padding: 14px 10px;
  text-align: center;
  transition: all .25s;
  backdrop-filter: blur(10px);
  position: relative;
}
.team-card.active {
  border-color: var(--bronze);
  background: linear-gradient(135deg, var(--bg-card-hover), var(--bg-card));
  box-shadow:
    0 0 0 2px rgba(205,127,50,0.2),
    0 8px 30px -6px var(--bronze);
  transform: scale(1.04);
}
.team-avatar { font-size: 34px; margin-bottom: 4px; }
.team-name { font-weight: 700; font-size: 15px; }
.team-score {
  font-family: 'IBM Plex Sans Arabic', sans-serif;
  font-size: 32px;
  background: linear-gradient(135deg, var(--bronze-light), var(--bronze));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-top: 4px;
  font-weight: 700;
}

/* وسائل المساعدة - lifelines */
.lifelines {
  display: flex;
  gap: 4px;
  justify-content: center;
  margin-top: 6px;
}
.lifeline-dot {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--gold-warm), var(--bronze));
  font-size: 9px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: 700;
}
.lifeline-dot.used {
  background: rgba(0,0,0,0.3);
  opacity: 0.3;
}

/* ========== شاشة اللعب ========== */
.play-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  margin-bottom: 14px;
}
.play-cat {
  background: linear-gradient(135deg, var(--bg-card-hover), var(--bg-card));
  border: 1.5px solid var(--border-warm);
  color: var(--bronze-light);
  padding: 9px 18px;
  border-radius: 22px;
  font-weight: 700;
  font-size: 14px;
  backdrop-filter: blur(10px);
}
.round-indicator { font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 15px; color: var(--text-dim); font-weight: 700; }

/* المؤقت */
.timer-container { display: flex; justify-content: center; margin: 18px 0; }
.timer-circle { width: 120px; height: 120px; position: relative; }
.timer-circle svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer-bg { fill: none; stroke: rgba(255,215,170,0.1); stroke-width: 8; }
.timer-fg {
  fill: none;
  stroke: url(#timer-gradient);
  stroke-width: 8;
  stroke-linecap: round;
  transition: stroke-dashoffset 1s linear, stroke 0.3s;
  filter: drop-shadow(0 0 8px rgba(205,127,50,0.5));
}
.timer-fg.warning { stroke: var(--warn); filter: drop-shadow(0 0 8px var(--warn)); }
.timer-fg.danger { stroke: var(--danger); animation: pulse 1s infinite; filter: drop-shadow(0 0 12px var(--danger)); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
.timer-number {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: 'IBM Plex Sans Arabic', sans-serif;
  font-size: 42px;
  background: linear-gradient(135deg, var(--bronze-light), var(--bronze));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 700;
}

/* السؤال */
.question-text {
  font-family: 'IBM Plex Sans Arabic', sans-serif;
  font-size: 22px;
  line-height: 1.7;
  text-align: center;
  background: linear-gradient(135deg, var(--bg-card), var(--bg-card-hover));
  border: 1.5px solid var(--border-warm);
  border-radius: 22px;
  padding: 28px 24px;
  margin: 18px 0;
  min-height: 130px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  color: var(--text);
  backdrop-filter: blur(12px);
  position: relative;
}
.question-text::before, .question-text::after {
  content: '';
  position: absolute;
  width: 30px;
  height: 30px;
  border: 2px solid var(--bronze);
  opacity: 0.5;
}
.question-text::before { top: 12px; right: 12px; border-bottom: 0; border-left: 0; }
.question-text::after { bottom: 12px; left: 12px; border-top: 0; border-right: 0; }

.answers-grid { display: grid; gap: 11px; margin: 16px 0; }
.answer-btn {
  background: var(--bg-card);
  border: 2px solid var(--border-warm);
  color: var(--text);
  padding: 17px 22px;
  border-radius: 16px;
  font-family: inherit;
  font-weight: 600;
  font-size: 17px;
  cursor: pointer;
  transition: all .25s;
  text-align: right;
  width: 100%;
  backdrop-filter: blur(8px);
}
.answer-btn:active { transform: scale(0.98); }
.answer-btn:hover:not(:disabled):not(.correct):not(.wrong):not(.disabled) {
  background: var(--bg-card-hover);
  border-color: var(--bronze);
}
.answer-btn.correct {
  background: var(--success-bg);
  border-color: var(--success);
  color: #6ee7b7;
  box-shadow: 0 0 24px -6px var(--success);
}
.answer-btn.wrong {
  background: var(--danger-bg);
  border-color: var(--danger);
  color: #fca5a5;
  opacity: 0.85;
}
.answer-btn.disabled { opacity: 0.3; pointer-events: none; }
.answer-btn.eliminated { opacity: 0.2; text-decoration: line-through; pointer-events: none; }

/* وسائل المساعدة في شاشة اللعب */
.lifelines-bar {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin: 12px 0;
}
.lifeline-btn {
  background: linear-gradient(135deg, var(--gold-warm), var(--bronze));
  border: 0;
  border-radius: 12px;
  padding: 10px 14px;
  color: #fff;
  font-family: inherit;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all .2s;
  box-shadow: 0 4px 12px -4px var(--bronze);
}
.lifeline-btn:hover { transform: translateY(-2px); }
.lifeline-btn:active { transform: scale(0.95); }
.lifeline-btn:disabled, .lifeline-btn.used {
  background: rgba(0,0,0,0.3);
  color: var(--text-mute);
  cursor: not-allowed;
  box-shadow: none;
  opacity: 0.5;
}

.hint-card {
  background: var(--bg-card);
  border: 1.5px solid var(--border-warm);
  border-right: 4px solid var(--gold-warm);
  border-radius: 14px;
  padding: 16px 18px;
  margin: 12px 0;
  font-size: 16px;
  font-weight: 500;
  line-height: 1.7;
  backdrop-filter: blur(10px);
}

/* Modal */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(13, 0, 36, 0.92);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  padding: 20px;
  backdrop-filter: blur(10px);
  animation: fadeIn .25s ease;
}
.modal-content {
  background: linear-gradient(180deg, var(--plum-light), var(--plum));
  border: 1.5px solid var(--border-warm);
  border-radius: 24px;
  padding: 28px;
  width: 100%;
  max-width: 440px;
  max-height: 92vh;
  overflow-y: auto;
  animation: scaleIn .3s ease;
  box-shadow: 0 24px 60px -12px rgba(0,0,0,0.6);
}

.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(135deg, var(--plum-light), var(--plum));
  border: 1.5px solid var(--bronze);
  border-radius: 16px;
  padding: 14px 24px;
  font-weight: 700;
  font-size: 15px;
  z-index: 1000;
  animation: toastIn .3s ease;
  box-shadow: 0 8px 32px -8px rgba(0,0,0,0.6);
}
@keyframes toastIn { from { opacity:0; transform: translate(-50%, 20px);} to { opacity:1; transform: translate(-50%, 0);} }

/* الأزرار العائمة */
.fullscreen-btn, .pause-btn, .theme-btn {
  position: fixed;
  top: 14px;
  width: 50px; height: 50px;
  border-radius: 50%;
  font-size: 22px;
  cursor: pointer;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 20px -4px rgba(0,0,0,0.5);
  backdrop-filter: blur(12px);
  transition: all .2s;
  border: 2px solid;
}
.fullscreen-btn {
  right: 14px;
  background: linear-gradient(135deg, rgba(205,127,50,0.4), rgba(205,127,50,0.15));
  border-color: var(--border-strong);
  color: var(--bronze-light);
}
.theme-btn {
  right: 76px;
  background: linear-gradient(135deg, var(--plum-light), var(--plum));
  border-color: var(--border-warm);
  color: var(--gold-warm);
  font-size: 24px;
}
.pause-btn {
  left: 14px;
  background: linear-gradient(135deg, rgba(204,85,0,0.4), rgba(204,85,0,0.15));
  border-color: rgba(204,85,0,0.6);
  color: var(--burnt-light);
  display: none;
}
.fullscreen-btn:active, .pause-btn:active, .theme-btn:active { transform: scale(0.92); }

.warning-banner {
  background: linear-gradient(135deg, rgba(251,191,36,0.18), rgba(251,191,36,0.06));
  border: 1.5px solid rgba(251,191,36,0.4);
  border-radius: 14px;
  padding: 14px 16px;
  font-size: 14px;
  color: var(--warn);
  margin-bottom: 16px;
  display: flex;
  gap: 12px;
  line-height: 1.6;
  font-weight: 500;
  backdrop-filter: blur(8px);
}

.confetti { position: fixed; width: 12px; height: 12px; pointer-events: none; z-index: 999; animation: confetti-fall 3s linear forwards; }
@keyframes confetti-fall {
  0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

.badge { display: inline-block; padding: 5px 14px; border-radius: 14px; font-size: 13px; font-weight: 700; }
.badge-warm { background: var(--bg-card-hover); color: var(--bronze-light); border: 1px solid var(--border-warm); }

/* ========== شاشة استعداد الفريق ========== */
.ready-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 80vh;
  text-align: center;
  gap: 24px;
  animation: scaleIn .4s cubic-bezier(.34,1.56,.64,1);
}
.ready-team-badge {
  background: var(--bg-card);
  border: 3px solid var(--bronze);
  border-radius: 28px;
  padding: 28px 40px;
  backdrop-filter: blur(12px);
  animation: float 3s ease-in-out infinite;
}
.ready-avatar { font-size: 80px; margin-bottom: 10px; }
.ready-team-name {
  font-family: 'IBM Plex Sans Arabic', sans-serif;
  font-size: 32px;
  font-weight: 700;
  margin-bottom: 6px;
}
.ready-turn-label {
  font-size: 18px;
  color: var(--text-warm);
  font-weight: 600;
}
.ready-cat-info {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.ready-cat-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  filter: drop-shadow(0 6px 16px rgba(0,0,0,0.3));
}
.ready-cat-name {
  font-family: 'IBM Plex Sans Arabic', sans-serif;
  font-size: 26px;
  font-weight: 700;
  color: var(--text);
}
.ready-points {
  font-family: 'Inter', sans-serif;
  font-size: 22px;
  font-weight: 900;
  background: linear-gradient(135deg, var(--bronze-light), var(--bronze));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.ready-hint {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--bg-card);
  border: 1.5px solid var(--border-warm);
  border-radius: 14px;
  padding: 14px 20px;
  font-size: 14px;
  color: var(--text-warm);
  font-weight: 500;
  max-width: 360px;
}
.ready-hint span { font-size: 24px; }
.ready-btn {
  padding: 20px !important;
  font-size: 19px !important;
  max-width: 360px;
  animation: pulse-glow 2s infinite;
}

/* ========== شريط تقدم اللعبة ========== */
.game-progress {
  margin-bottom: 16px;
}
.game-progress-bar {
  height: 8px;
  background: var(--bg-deep);
  border-radius: 4px;
  overflow: hidden;
  border: 1px solid var(--border-warm);
}
.game-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--bronze-light), var(--bronze), var(--burnt-orange));
  border-radius: 4px;
  transition: width 0.6s cubic-bezier(.4,0,.2,1);
  box-shadow: 0 0 8px rgba(205,127,50,0.5);
}
.game-progress-text {
  text-align: center;
  font-size: 12px;
  color: var(--text-dim);
  font-weight: 600;
  margin-top: 6px;
}

/* تأثير نبض للخانة عند الاختيار */
@keyframes cell-select-pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.15); box-shadow: 0 0 25px var(--bronze); }
  100% { transform: scale(1); }
}
.grid-cell.selecting {
  animation: cell-select-pulse 0.4s ease;
}

/* ========== نظام XP والإنجازات ========== */
.xp-card {
  background: linear-gradient(135deg, var(--bg-card-hover), var(--bg-card));
  border: 1.5px solid var(--border-warm);
  border-radius: 20px;
  padding: 16px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  transition: all .25s;
  margin-bottom: 14px;
  backdrop-filter: blur(12px);
}
.xp-card:active { transform: scale(0.98); }
.xp-card:hover { border-color: var(--bronze); }
.xp-level-icon { font-size: 44px; }
.xp-info { flex: 1; }
.xp-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.xp-level-name {
  font-family: 'IBM Plex Sans Arabic', sans-serif;
  font-weight: 700;
  font-size: 18px;
  line-height: 1.2;
}
.xp-xp-value {
  font-size: 13px;
  color: var(--text-dim);
  font-weight: 600;
  margin-top: 2px;
}
.xp-stats-mini {
  font-size: 12px;
  color: var(--text-warm);
  font-weight: 600;
}
.xp-ach-count {
  font-size: 12px;
  color: var(--bronze-light);
  font-weight: 700;
  margin-top: 4px;
}
.xp-bar {
  height: 6px;
  background: var(--bg-deep);
  border-radius: 3px;
  overflow: hidden;
  margin-top: 4px;
}
.xp-bar-fill {
  height: 100%;
  transition: width 1s ease;
  border-radius: 3px;
}

/* الإحصائيات المصغّرة */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 8px;
}
.stat-mini {
  background: var(--bg-card);
  border: 1.5px solid var(--border-warm);
  border-radius: 14px;
  padding: 14px;
  text-align: center;
  backdrop-filter: blur(8px);
}
.stat-mini-label {
  font-size: 12px;
  color: var(--text-dim);
  font-weight: 600;
  margin-bottom: 6px;
}
.stat-mini-value {
  font-family: 'IBM Plex Sans Arabic', sans-serif;
  font-size: 26px;
  background: linear-gradient(135deg, var(--bronze-light), var(--bronze));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 700;
}

/* بطاقة إنجاز */
.achievement-card {
  background: var(--bg-card);
  border: 1.5px solid var(--border-warm);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 8px;
  backdrop-filter: blur(8px);
}
.achievement-card.unlocked {
  border-color: var(--bronze);
  background: linear-gradient(135deg, var(--bg-card-hover), var(--bg-card));
}
.achievement-card.locked {
  background: rgba(0,0,0,0.2);
  border-color: rgba(205,127,50,0.15);
}
.ach-icon { font-size: 36px; }
.ach-info { flex: 1; }
.ach-name { font-weight: 700; font-size: 15px; margin-bottom: 3px; }
.ach-desc { font-size: 12px; color: var(--text-dim); font-weight: 500; }
.ach-xp {
  background: linear-gradient(135deg, var(--bronze-light), var(--bronze));
  color: #fff;
  padding: 5px 10px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 12px;
  white-space: nowrap;
}

@media (min-width: 640px) {
  .stats-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (min-width: 1024px) {
  .stats-grid { grid-template-columns: repeat(6, 1fr); }
}

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg-deep); }
::-webkit-scrollbar-thumb { background: var(--bronze-deep); border-radius: 4px; }

@media (min-width: 1200px) {
  .app.fullscreen-mode .question-text { font-size: 46px !important; min-height: 240px; }
  .app.fullscreen-mode .answers-grid { grid-template-columns: repeat(2, 1fr); }
  .app.fullscreen-mode .grid-cell { font-size: 32px !important; padding: 28px !important; }
}

/* ========== لعبة الجاسوس ========== */
.spy-intro-card {
  display: flex; align-items: center; gap: 14px;
  padding: 16px; border-radius: 18px; margin-bottom: 16px;
  background: linear-gradient(135deg, rgba(168,85,247,0.15), rgba(168,85,247,0.04));
  border: 1px solid rgba(168,85,247,0.3);
}
.spy-intro-icon { font-size: 38px; flex-shrink: 0; }
.spy-intro-text { color: var(--text-warm); font-size: 14px; line-height: 1.6; }
.spy-label { color: var(--text); font-weight: 700; font-size: 15px; display: block; }
.spy-hint { color: var(--text-mute); font-size: 12px; margin-top: 8px; text-align: center; }
.spy-stepper {
  display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 12px;
}
.spy-step-btn {
  width: 46px; height: 46px; border-radius: 14px;
  background: var(--bg-card); border: 1px solid var(--border-warm);
  color: var(--bronze-light); font-size: 26px; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all .2s;
}
.spy-step-btn:hover { background: var(--bg-card-hover); border-color: var(--border-strong); }
.spy-step-btn:active { transform: scale(0.92); }
.spy-step-value { color: var(--text); font-size: 22px; font-weight: 800; min-width: 90px; text-align: center; }
.spy-name-input, .spy-select {
  width: 100%; padding: 13px 14px; border-radius: 12px;
  background: var(--bg-card); border: 1px solid var(--border-warm);
  color: var(--text); font-size: 15px; font-family: inherit;
}
.spy-select { cursor: pointer; }
.spy-toggle-row { display: flex; align-items: center; justify-content: space-between; }
.spy-toggle-row input[type=checkbox] { width: 24px; height: 24px; accent-color: var(--bronze); cursor: pointer; }

/* مرحلة الكشف */
.spy-reveal-screen { display: flex; flex-direction: column; justify-content: center; min-height: 70vh; }
.spy-pass-card, .spy-role-card {
  text-align: center; padding: 36px 24px; border-radius: 24px;
  background: var(--bg-glass); border: 1px solid var(--border-warm);
  backdrop-filter: blur(16px);
}
.spy-pass-avatar { font-size: 64px; margin-bottom: 12px; }
.spy-pass-name { font-size: 26px; font-weight: 800; color: var(--text); margin-bottom: 16px; }
.spy-pass-instruction { color: var(--text-dim); font-size: 15px; line-height: 1.7; }
.spy-role-icon { font-size: 70px; margin-bottom: 12px; }
.spy-role-title { font-size: 28px; font-weight: 900; margin-bottom: 14px; }
.spy-role-spy { border-color: var(--danger); background: linear-gradient(135deg, rgba(248,113,113,0.15), var(--bg-glass)); }
.spy-role-spy .spy-role-title { color: var(--danger); }
.spy-role-citizen { border-color: var(--success); background: linear-gradient(135deg, rgba(61,220,132,0.12), var(--bg-glass)); }
.spy-role-citizen .spy-role-title { color: var(--success); }
.spy-role-desc { color: var(--text-warm); font-size: 15px; line-height: 1.7; }
.spy-role-label { color: var(--text-dim); font-size: 14px; margin-bottom: 8px; }
.spy-role-word { font-size: 36px; font-weight: 900; color: var(--gold-bright); margin-bottom: 6px; }
.spy-role-cat { color: var(--text-mute); font-size: 13px; }
.spy-reveal-progress { text-align: center; color: var(--text-mute); font-size: 14px; margin-top: 16px; }

/* مرحلة الأسئلة */
.spy-timer-big {
  text-align: center; font-size: 56px; font-weight: 900; color: var(--gold-bright);
  font-family: 'Inter', sans-serif; margin: 10px 0 18px;
}
.spy-no-timer { color: var(--text-mute); }
.spy-play-card {
  padding: 20px; border-radius: 18px; background: var(--bg-glass);
  border: 1px solid var(--border-warm); margin-bottom: 14px;
}
.spy-play-start { text-align: center; font-size: 17px; color: var(--text); margin-bottom: 16px; }
.spy-play-start b { color: var(--gold-bright); }
.spy-play-rules { display: flex; flex-direction: column; gap: 10px; }
.spy-rule { color: var(--text-warm); font-size: 14px; line-height: 1.5; }
.spy-players-strip { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.spy-player-chip {
  display: flex; align-items: center; gap: 5px; padding: 7px 13px;
  border-radius: 20px; background: var(--bg-card); border: 1px solid var(--border-warm);
  font-size: 13px; color: var(--text);
}

/* التصويت */
.spy-vote-prompt { text-align: center; color: var(--text-warm); font-size: 16px; margin-bottom: 18px; line-height: 1.6; }
.spy-vote-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.spy-vote-card {
  padding: 18px 12px; border-radius: 16px; text-align: center; cursor: pointer;
  background: var(--bg-card); border: 2px solid var(--border-warm); transition: all .2s;
}
.spy-vote-card:hover { background: var(--bg-card-hover); }
.spy-vote-card.selected { border-color: var(--bronze-light); background: var(--bg-card-hover); box-shadow: 0 0 0 3px var(--glow-bronze); }
.spy-vote-avatar { font-size: 40px; margin-bottom: 6px; }
.spy-vote-name { color: var(--text); font-weight: 700; font-size: 14px; }

/* فرصة الجاسوس */
.spy-caught-card {
  text-align: center; padding: 28px 20px; border-radius: 22px; margin-bottom: 18px;
  background: linear-gradient(135deg, rgba(248,113,113,0.12), var(--bg-glass));
  border: 1px solid var(--danger);
}
.spy-caught-icon { font-size: 56px; margin-bottom: 10px; }
.spy-caught-title { font-size: 24px; font-weight: 900; color: var(--danger); margin-bottom: 8px; }
.spy-caught-spies { font-size: 17px; color: var(--text); font-weight: 700; margin-bottom: 12px; }
.spy-caught-desc { color: var(--text-warm); font-size: 14px; line-height: 1.6; }
.spy-guess-prompt { text-align: center; color: var(--text); font-size: 18px; font-weight: 700; margin-bottom: 14px; }
.spy-guess-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.spy-guess-option {
  padding: 16px 10px; border-radius: 14px; cursor: pointer; font-size: 15px; font-weight: 700;
  background: var(--bg-card); border: 1px solid var(--border-warm); color: var(--text);
  transition: all .2s; font-family: inherit;
}
.spy-guess-option:hover { background: var(--bg-card-hover); border-color: var(--border-strong); transform: translateY(-2px); }
.spy-guess-option:active { transform: scale(0.96); }

/* النتيجة */
.spy-result-card {
  text-align: center; padding: 32px 24px; border-radius: 24px;
  background: var(--bg-glass); border: 2px solid var(--border-warm); backdrop-filter: blur(16px);
}
.spy-result-icon { font-size: 76px; margin-bottom: 12px; }
.spy-result-title { font-size: 30px; font-weight: 900; margin-bottom: 12px; }
.spy-result-desc { color: var(--text-warm); font-size: 15px; line-height: 1.7; margin-bottom: 20px; }
.spy-result-reveal { padding: 18px; border-radius: 16px; background: var(--bg-card); border: 1px solid var(--border-warm); }
.spy-result-word-label { color: var(--text-dim); font-size: 13px; margin-bottom: 6px; }
.spy-result-word { font-size: 32px; font-weight: 900; color: var(--gold-bright); margin-bottom: 4px; }
.spy-result-cat { color: var(--text-mute); font-size: 13px; }

/* سوالف مخصصة */
.spy-custom-item {
  display: flex; align-items: center; justify-content: space-between; padding: 12px 14px;
  border-radius: 12px; background: var(--bg-card); border: 1px solid var(--border-warm); color: var(--text);
}
.spy-empty { text-align: center; color: var(--text-mute); padding: 30px; font-size: 15px; }

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="timer-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e89e54"/>
      <stop offset="100%" stop-color="#cd7f32"/>
    </linearGradient>
  </defs>
</svg>

<div id="app" class="app">
  <button class="theme-btn" onclick="toggleTheme()" id="theme-btn">🌸</button>
  <button class="fullscreen-btn" onclick="toggleFullscreen()" id="fs-btn">⛶</button>
  <button class="pause-btn" onclick="pauseGameMenu()" id="pause-btn">⏸️</button>
  <div id="screen-container"></div>
</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
  if (window.caches) caches.keys().then(names => names.forEach(n => caches.delete(n)));
}
</script>
<script src="app-merged.js"></script>

</body>
</html>
